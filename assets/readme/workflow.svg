<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320" viewBox="0 0 1200 320"
     role="img" aria-labelledby="ssp-wf-t ssp-wf-d">
  <title id="ssp-wf-t">How Smart Sprint Planner is built</title>
  <desc id="ssp-wf-d">Two widgets — the main-menu planner and the project settings page — share one logic core, backend-core.js, which persists everything to Project extension properties under the ssp namespace. Every mutating endpoint is authorized server-side.</desc>

  <rect width="1200" height="320" rx="24" fill="#F2F0EA"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

    <g id="widget-planner">
      <rect x="56" y="52" width="312" height="92" rx="12" fill="#FFFFFF" stroke="#1B2A4E" stroke-width="2"/>
      <text x="80" y="88" font-size="19" font-weight="600" fill="#1B2A4E">Main-menu planner</text>
      <text x="80" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6E7686">MAIN_MENU_ITEM · ssp-main-global</text>
      <text x="80" y="131" font-size="13" fill="#3A445C">planning · backlog · Gantt · history · reports</text>
    </g>

    <g id="widget-settings">
      <rect x="56" y="176" width="312" height="92" rx="12" fill="#FFFFFF" stroke="#1B2A4E" stroke-width="2"/>
      <text x="80" y="212" font-size="19" font-weight="600" fill="#1B2A4E">Project settings</text>
      <text x="80" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6E7686">PROJECT_SETTINGS · ssp-main</text>
      <text x="80" y="255" font-size="13" fill="#3A445C">roles · fields · modes · settings manager group</text>
    </g>

    <g id="core">
      <rect x="478" y="112" width="292" height="96" rx="12" fill="#1B2A4E"/>
      <text x="502" y="150" font-size="19" font-weight="600" fill="#F2F0EA">Shared logic core</text>
      <text x="502" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#B8C0D4">backend-core.js</text>
      <text x="502" y="193" font-size="13" fill="#C9CFDE">validation · aggregation · authorization</text>
    </g>

    <g id="storage">
      <rect x="852" y="112" width="292" height="96" rx="12" fill="#FFFFFF" stroke="#1B2A4E" stroke-width="2"/>
      <text x="876" y="150" font-size="19" font-weight="600" fill="#1B2A4E">Project storage</text>
      <text x="876" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6E7686">Project.extensionProperties · ssp_*</text>
      <text x="876" y="193" font-size="13" fill="#3A445C">sprints · history · releases · capacity</text>
    </g>

    <g id="arrows" stroke="#FF6A3D" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M368 98 C 430 98, 430 136, 470 140"/>
      <path d="M368 222 C 430 222, 430 184, 470 180"/>
      <path d="M770 160 L 844 160"/>
      <g fill="#FF6A3D" stroke="none">
        <path d="M470 140 l -12 -7 l 2 7 l -2 7 z"/>
        <path d="M470 180 l -12 -7 l 2 7 l -2 7 z"/>
        <path d="M844 160 l -12 -7 l 2 7 l -2 7 z"/>
      </g>
    </g>

    <text x="600" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" letter-spacing="1" fill="#6E7686">SERVER-SIDE AUTHORIZATION ON EVERY MUTATING ENDPOINT · DENY BY DEFAULT</text>
  </g>
</svg>
