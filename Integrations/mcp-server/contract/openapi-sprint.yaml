openapi: 3.1.0

# ══════════════════════════════════════════════════════════════════════════════
# Smart Sprint Planner — контракт внешнего REST.
#
# Назначение: внешняя система (ИИ-агент, n8n, скрипт интеграции) читает и меняет
# данные планера проекта — спринт и состав задач, историю, ёмкость, календарь и
# отсутствия, релизы, напоминания — через REST YouTrack и постоянный токен
# учётной записи.
#
# Источник правды — серверные валидаторы плагина. Файл сверяется с кодом гейтами:
# tests/arch/api-contract.test.js (ключи схем, версия, правило аддитивности) и
# tests/arch/error-codes.test.js (перечень кодов отказов). Версия файла равна
# версии плагина.
#
# Редакция 3.49.0: 43 операции (23 сочетания «метод + путь», варианты записи —
# параметром action), единый конверт отказа, мелкие операции для агентов,
# исправлен адрес глобального контура.
# Редакция 3.51.0: 46 операций (25 сочетаний «метод + путь») — добавлены список
# проектов с планером, роли вызывающего и удаление релиза.
# ══════════════════════════════════════════════════════════════════════════════

info:
  title: Smart Sprint Planner — внешний REST
  version: 3.51.0
  description: |
    ## Совместимость — правило аддитивности

    Внешний контракт меняется **только добавлением**: существующие пути, ключи и их
    смысл не переименовываются и не удаляются; новое появляется новыми ключами или
    новыми вызовами. Сервер принимает тела прежних редакций (неизвестные ему ключи
    отклоняет, отсутствующие считает пустыми). Поэтому номера версии в путях нет:
    интеграция, написанная под редакцию N, продолжает работать на N+1. Гарантия
    держится механически — `tests/arch/api-contract.test.js` сверяет этот файл с
    белыми списками кода и с базовой линией ключей (удаление/переименование = красный
    гейт), а `version` здесь равна версии плагина.

    Вечное обещание распространяется на то, что клиент **присылает** (тела запросов
    и их ключи). Схемы ответов описаны для чтения: их ключи не исчезают, но состав
    может расширяться — клиент обязан игнорировать незнакомые ключи ответа.

    Ужесточение проверки допустимо только там, где контракт уже требовал
    этого раньше: так в 3.38.0 сервер начал отвергать запись без `baseRev`
    (`base_rev_required`) — ключ значился в `required` с 3.17.0, менялось лишь
    поведение сервера для тел, нарушавших контракт.

    Записи редакции 3.49.0:
    - **Адрес глобального контура исправлен.** Прежние редакции обещали форму
      `/api/admin/projects/{projectId}/extensionEndpoints/…/backend-global/…` — она
      никогда не работала (404 `HTTP handler not found`). Рабочая форма — без
      префикса `/api/admin/projects/` (раздел «Адреса»).
    - **`baseRev` обязателен у всех данных с ревизией** — кроме спринта теперь и у
      истории (запись без `action` и `snapshot`), релизов и отсутствий. Эти пути
      раньше в контракте не значились, обещание не нарушено.
    - **Отсутствия принимаются только обёрткой** `{absences, baseRev}`.
    - **Смешанное тело** `settings` вместе с `sprint` либо `roleItems` отклоняется
      (`mixed_settings_write`) — раньше часть тела успевала записаться до проверки прав.
    - У каждого отказа есть `reason` и `cid` (раньше — не у всех).

    Записи редакции 3.49.1:
    - **`POST /calendar` без `years`** (в том числе пустым телом) отклоняется —
      `calendar_invalid`, поле `years`, код `not_object`; раньше такой запрос записывал
      пустой календарь. Явный пустой `years: {}` остаётся осознанной очисткой.
    - **`POST /history` без `action` и без ключа `history`** отклоняется —
      `invalid_history_structure: missing`; раньше отвечал успехом без записи.

    Записи редакции 3.51.0 (только добавления):
    - **`POST /filter-planner-projects`** — какие из переданных проектов с подключённым
      планером видны вызывающему. Операция работала и раньше (выбор проекта в главном
      меню планера), в контракт внесена в 3.51.0.
    - **`GET /my-roles`** — роли вызывающего в проекте по группам планера.
    - **`POST /releases?action=removeRelease`** — удаление одного релиза из активного
      реестра (мелкая операция).

    ## Адреса

    **Основной — по ключу проекта (глобальный контур):**
    `{baseUrl}/api/extensionEndpoints/smart-sprint-planner/backend-global/{path}?projectKey={КЛЮЧ}`.
    Сервер сначала проверяет право пользователя токена читать проект средствами
    YouTrack (нет проекта и нет доступа — единый отказ `project_unavailable`), затем
    действует ролевая логика планера. Запись по ключу проекта работает после того,
    как планер хотя бы раз открыли в проекте либо сохранили его настройки — иначе
    `plugin_not_configured` (подробности — страница «Подключение и права»).

    **Альтернативный — по внутреннему id проекта (проектный контур):**
    `{baseUrl}/api/admin/projects/{projectId}/extensionEndpoints/smart-sprint-planner/backend-project/{path}`.
    `{projectId}` — внутренний id проекта YouTrack вида `0-9`
    (`GET {baseUrl}/api/admin/projects?fields=id,shortName`). Отличия: не зависит от
    шага «открыть планер в проекте»; **не закрывается тумблером «планер отключён»**
    (по основному адресу у отключённого проекта работает только сама операция
    `POST /planner-disabled`); параметр `projectKey` не используется.

    Адрес сервера по умолчанию в этом файле — заглушка `https://youtrack.example.local`:
    рабочий адрес инстанса подставляется вручную, кнопка «Try it out» со страницы
    документации в рабочий инстанс не попадает.

    ## Транспорт ошибок — ВАЖНО

    Платформа YouTrack **не пробрасывает HTTP-статусы приложения** на пути
    extensionEndpoints: и успех, и прикладные отказы приходят как **HTTP 200**.
    Единственный достоверный признак результата — тело ответа.

    - Успех: `{ "success": true, … }`.
    - Отказ: `{ "success": false, "error", "reason", "cid", … }`. `error` — класс
      (`Bad Request`, `Forbidden`, `rev_conflict`, `internal_error`; у отказов записи
      полей задач в `error` стоит сам код). `reason` — машинный код причины, есть
      всегда; по нему и следует ветвиться. `cid` — идентификатор запроса: назовите его
      в обращении к администратору, по нему находится строка в журнале сервера.
    - Код с суффиксом (`invalid_history_structure: <где>`, `ops_field_required:<поле>`,
      `phases_out_of_sprint:<фаза>` и др.) сравнивается по началу строки.
    - Универсальные коды тела любого POST: `too_large` (тело больше 2 МБ),
      `invalid_json`, `prototype_pollution_detected`.
    - Полный перечень кодов с пояснениями — `Integrations/ERROR_CODES.md` и страница
      документации «Ответы и коды отказов»; краткий — в схеме `AppError`.

    Настоящие не-200 статусы возможны только от самой платформы, с телом вида
    `{"error": "...", "error_description": "..."}` (проверено на YouTrack 2025.3):
    - **401** — токен отсутствует или невалиден;
    - **404** `HTTP handler not found` — неверный путь или имя приложения, **или
      приложение не включено в этом проекте** (включается администратором проекта).

    ## Ревизии и `baseRev`

    Данные с ревизией: спринт (`sprint._rev` из `GET /sprint-data`; пустой слот — 0),
    история (`rev` из `GET /history`), релизы (`rev` из `GET /releases`), отсутствия
    (`rev` из `GET /absences`). **Любая их запись, включая мелкие операции, требует
    числовой `baseRev`** — иначе `base_rev_required`. Ревизия разошлась — отказ
    `rev_conflict` с текущим `rev`: перечитать GET и повторить. Без ревизии по
    замыслу: ёмкость, календарь, напоминания, блокировка спринтов, отключение планера,
    `POST /history?action=clear|import-replace`.

    ## Мелкие операции (3.49.0)

    Полная запись заменяет данные целиком — агенту ради одной задачи приходится
    читать, менять и присылать всё. Мелкая операция меняет одно: сервер сам читает
    хранимые данные, применяет изменение и прогоняет результат через ту же полную
    запись — права, проверки, лимиты, ревизии и отказы у неё те же. Ответ — конверт
    полной записи плюс `action` и `applied` (что именно изменено). Перечень:
    `upsertItem`, `removeItem`, `patchSprint`, `assignPerson` (`/sprint-data`);
    `upsertPerson` (`/capacity`); `upsertAbsence`, `removeAbsence` (`/absences`);
    `upsertRelease`, `setReleaseStatus`, `addReleaseIssues`, `removeReleaseIssues`,
    `removeRelease` — с 3.51.0 (`/releases`). `upsert*` — слияние: присланные ключи обновляют запись, остальные
    сохраняются (исключение — `upsertAbsence`: запись заменяется целиком).

    ## Ограниченные операции

    Операции, которые заменяют данные целиком, необратимы либо меняют режим работы
    проекта, помечены «⚠ Ограниченная» в заголовке и расширением `x-restricted: true`
    (у смешанных путей — на схеме тела полной замены). Они описаны, потому что
    существуют и доступны токену с соответствующей ролью; интеграции должны
    пользоваться ими осознанно, а где есть мелкая операция — предпочитать её.

    ## Сценарий заливки черновика

    1. `GET /sprint-data` — получить текущее состояние слота.
       Ревизия слота — поле `sprint._rev` (если `sprint` = null, слот пуст,
       ревизия считается равной 0).
    2. Собрать тело: `{ "sprint": {...}, "roleItems": {...}, "baseRev": <_rev из шага 1> }`.
       Для черновика `sprint.status` = `"PLANNING"`.
    3. `POST /sprint-data`. Ответ `{"success":true, "rev":N}` — записано;
       `{"success":false,"error":"rev_conflict","rev":N}` — слот изменился
       между шагами 1 и 3 (кто-то сохранил из интерфейса) → повторить с шага 1;
       `{"success":false,"error":"Bad Request","reason":...}` — структура
       отвергнута валидатором, повторять без исправления тела бессмысленно.

    ## Правила данных

    - **Один рабочий слот на проект.** Полная запись `POST /sprint-data` заменяет
      состав целиком. Заливайте черновик до начала ручного планирования —
      оптимистическая блокировка (`baseRev`) защищает от гонок, но не от намеренной
      перезаписи чужого черновика свежепрочитанной ревизией.
    - **Enum-коды — только латинские** (`PLANNING`, `INC_PLANNED`, …).
      Русские строки прежнего написания мигрируются только на чтении;
      на записи будут отвергнуты.
    - **Все числовые трудозатраты и ресурсы — в минутах** (внутренний формат
      длительностей YouTrack). В интерфейсе отображаются часы (значение / 60).
    - **Роли заполняются только из `settings.activeRoles`** ответа GET —
      остальные роли в проекте не используются.
    - Белые списки ключей строгие: неизвестный ключ в `sprint`/`roleItems`/задаче →
      `invalid_*_structure`. Не отправляйте ничего сверх задокументированного.
    - Лимиты: сериализованный `sprint` ≤ 500 КБ, `roleItems` ≤ 500 КБ,
      всё тело запроса ≤ 2 МБ, ≤ 1000 задач на роль.

    ## Авторизация и права

    Постоянный (permanent) токен пользователя YouTrack в заголовке
    `Authorization: Bearer perm-...`; рекомендуется отдельный сервисный пользователь
    на проект.

    - **Чтение (все GET)** — достаточно факта аутентификации плюс доступа к проекту
      средствами YouTrack; роль планера не проверяется. Следствие: любой участник
      проекта читает настройки проекта (включая состав групп по ролям), ставки,
      грейды и отсутствия сотрудников — это принятая модель доверия, а не ошибка.
    - **Запись** — по ролям планера (группы задаются в настройках приложения в
      проекте): редактор, согласующий, распределяющий, управление настройками,
      планировочный менеджер, управление историей, релиз-менеджер и релиз-инженер.
      Роль каждой операции названа в её описании.
    - **`plugin_not_configured`** возвращается **только на запись** и только
      если в настройках приложения в проекте не заполнена группа управления
      настройками. Чтение при этом работает.
    - ⚠️ **Потолок прав сервисного токена:** роль редактора входит в объединение
      ролей, допускаемых к `POST /update-issue-field` — то есть токен с правом
      заливать спринт технически может писать назначенные планеру поля задач
      проекта — **только тех, которые сервисный пользователь видит и мог бы менять
      сам по правам YouTrack** (иначе `issue_not_found` / `field_not_writable`).
      Подробности и меры — страница «Подключение и права».

servers:
  - url: "{baseUrl}/api/extensionEndpoints/smart-sprint-planner/backend-global"
    description: |
      Основной адрес — по ключу проекта: обязателен query-параметр `projectKey=<КЛЮЧ>`;
      право чтения проекта проверяется до ролевой логики.
    variables:
      baseUrl:
        default: https://youtrack.example.local
        description: Базовый URL инстанса YouTrack (без завершающего /) — заглушка, подставьте свой
  - url: "{baseUrl}/api/admin/projects/{projectId}/extensionEndpoints/smart-sprint-planner/backend-project"
    description: Альтернативный адрес — по внутреннему id проекта; тумблером «планер отключён» не закрывается
    variables:
      baseUrl:
        default: https://youtrack.example.local
        description: Базовый URL инстанса YouTrack (без завершающего /) — заглушка, подставьте свой
      projectId:
        default: "0-0"
        description: Внутренний id проекта YouTrack (не ключ проекта)

security:
  - bearerAuth: []

tags:
  - name: Спринт
    description: Рабочий слот планирования — спринт, состав задач по ролям, согласование, распределение по людям, фазы; версия плагина
  - name: История
    description: Снимки спринтов по ролям. Чтение — для всех участников проекта; любая запись — ограниченная
  - name: Ёмкость
    description: Запись ёмкости спринта — участники, грейды, ставки, доли по ролям; утверждение
  - name: Календарь и отсутствия
    description: Производственный календарь проекта и реестр отсутствий сотрудников
  - name: Релизы
    description: Реестр релизов проекта, продвижение статусов, состав задач релиза, архив
  - name: Напоминания
    description: Напоминания по спринтам, ёмкости и релизам и их журнал
  - name: Блокировка спринтов
    description: Запрет создания новых спринтов в проекте
  - name: Администрирование
    description: Отключение планера в проекте и запись полей задач — ограниченные операции
  - name: Доступ
    description: Проекты с подключённым планером и роли вызывающего в проекте (3.51.0)

paths:
  /sprint-data:
    get:
      operationId: getSprintData
      tags: [Спринт]
      summary: Текущее состояние рабочего слота планирования проекта
      description: |
        Возвращает рабочий спринт, состав по ролям и настройки проекта.
        Ревизия для optimistic lock — `sprint._rev` (слот пуст → 0).
        Права: факт аутентификации + доступ к проекту (роль планера не нужна).
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Состояние слота, либо прикладная ошибка (`success:false`) —
            HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GetSprintDataOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: postSprintData
      tags: [Спринт]
      summary: Запись рабочего слота — полная запись, согласование, распределение, фазы, мелкие операции (3.49.0)
      description: |
        Все записи рабочего слота планирования проекта. Вариант выбирает query-параметр
        `action`; параметр не передан — полная запись. Неизвестное значение — `invalid_action`.

        **Ревизия** — `sprint._rev` из `GET /sprint-data` (слот пуст → 0). Любое тело с
        `sprint` либо `roleItems` и любая мелкая операция требуют числовой `baseRev` —
        иначе `base_rev_required`. Ревизия разошлась — `rev_conflict` с текущим `rev`,
        ничего не записано: перечитать GET и повторить. Успешная запись увеличивает
        ревизию; новое значение — `rev` ответа (его нет, только когда состав записан в
        пустой слот: спринта нет, ревизия остаётся 0).

        **Общее.** Ключи верхнего уровня вне схемы варианта в контракт не входят — сервер
        их не читает; неизвестный ключ внутри `sprint`, `roleItems` и задачи — отказ. Настройки проекта
        (`settings` в теле) — отдельный контур прав, в контракт не входят; смешанное тело —
        `settings` вместе с `sprint` либо `roleItems` — отклоняется до любой записи:
        `mixed_settings_write` (3.49.0). Отказы прав, общие для всех вариантов, —
        `auth_required` и `plugin_not_configured`.

        **без `action` — полная запись** — заливка черновика: `sprint` + `roleItems`
        заменяют спринт слота и состав по ролям целиком (состав проверяется до записи
        спринта). Роль: редактор (`editor_rights_required`). Сервер сам ставит
        `updatedBy`, `updatedAt`, `pluginVersion` и `_rev` спринта.
        Серверное обогащение (3.18.0): задача состава с `issueId`, но БЕЗ `title`
        наполняется из YouTrack (title/state/priority/xpriority/system/externalTicketId
        по настроенным полям проекта) — дополняется только пустое, присланное не
        перезаписывается. Не более 200 обогащаемых задач за запрос — остальные
        сохраняются как пришли; итог в поле `enriched` ответа. Задача, недоступная
        сервисному пользователю (Visible to), не обогащается и в счётчики не попадает.
        Перевод задачи в `INC_EXCLUDED` требует причины — `reason_required`,
        `reason_too_long` (3.46.0). Новый `sprintId` при включённой блокировке создания
        спринтов — `sprint_creation_locked`. Прочие отказы: `invalid_role_items_structure`,
        `role_items_data_too_large`, `invalid_sprint_structure`, `sprint_data_too_large`.
        ⚠ `sprint: null` сбрасывает слот (редактор либо согласующий; ревизия становится 0) —
        интеграциям не использовать. Ради одной задачи или одного поля весь слот
        пересылать не нужно — для этого есть мелкие операции ниже.

        **`validate`** — согласование спринта по роли: та же запись слота и состава в
        момент согласования плюс серверная проверка перелимита. Роль: согласующий
        (`validator_rights_required`); прав редактора не требует. Тело — как у полной
        записи. Параметр `role` сужает проверку до одной роли (не передан — все роли).
        В ответе `warnings` — строки `overlimit:<roleKey>`: сумма аллокаций (нет
        аллокации — оценка минус факт) запланированных и внеплановых задач роли больше
        её ресурса `resource<Роль>`. Предупреждение записи не отменяет; считается, когда в
        теле есть и `sprint`, и `roleItems`, и отключается настройкой проекта «разрешить
        планирование сверх лимита». Прочие отказы — как у полной записи.

        **`assignerSync`** — персональное распределение: заменяет `personalPlanning`
        хранимого спринта. Роль: распределяющий (проходят также редактор, управление
        настройками, релиз-менеджер и релиз-инженер) — `assigner_rights_required`.
        Из `sprint` читается только `personalPlanning`, остальное берётся из хранимого;
        `roleItems` игнорируется. ⚠ `personalPlanning` отсутствует либо `null` —
        распределение обнуляется. Меняется только копия распределения в слоте: интерфейс
        планера читает распределение из записи роли в истории, поэтому внешним клиентам
        для назначения людей предназначена мелкая операция `assignPerson`. Ответ —
        `SprintAssignerSyncOk`. Отказы: `sprint_required` (3.49.0 — в теле нет `sprint`,
        он `null` либо не объект; раньше такой запрос отвечал успехом без записи),
        `sprint_not_found` (слот пуст), `invalid_personal_planning`,
        `invalid_sprint_structure`, `sprint_data_too_large`.

        **`phases`** — фазы работ (3.45.0); единственный путь их записи. В теле полной
        записи ключи `phases`, `phasesUpdatedAt`, `phasesUpdatedBy` **не записываются
        напрямую**: если у спринта есть носитель (рабочий слот или запись истории), сервер
        берёт хранимые значения; у спринта, впервые появляющегося в инстансе, входящие
        принимаются после проверки формы. Роль: редактор либо согласующий
        (`editor_rights_required`). Тело `{ "sprint": { "sprintId", "phases": { … } }, "baseRev" }`:
        из `sprint` читаются только `sprintId` и `phases`, прочие ключи игнорируются;
        `baseRev` обязателен числом, но сверяется с ревизией слота **только если слот
        держит этот спринт** — иначе спринт живёт записями истории и слот не трогается.
        Требуется включённая в настройках проекта функция фаз (иначе `phases_disabled`).
        Фазы копируются во все записи ролей этого спринта в истории — ревизия истории
        растёт (`historyRev` ответа), ранее прочитанный `rev` из `GET /history` устаревает.
        Проверяются только фазы, изменившиеся относительно сохранённых; ничего не
        изменилось → `changed:false` без записи и без роста ревизий. Штамп «кто и когда»
        ставит сервер. Ответ — `SprintPhasesOk`. Отказы: `invalid_phases_body`,
        `invalid_phases_structure:<фаза|shape>`, `sprint_not_found`, `sprint_finished`
        (слот спринт не держит, а все его записи истории завершены), `sprint_dates_missing`,
        `phases_out_of_sprint:<фаза>` (+ `errors: [{ phase, code, sprintDateStart,
        sprintDateEnd }]`), `invalid_sprint_structure`, `sprint_data_too_large`,
        `invalid_history_structure`, `history_data_too_large`.

        ### Мелкие операции (3.49.0)

        Сервер сам читает хранимые данные, применяет одно изменение и прогоняет результат
        через ту же полную запись: роль, проверки, обогащение задач, лимиты, серверные
        штампы и отказы — как у неё. Ответ — `OpsOk`: конверт полной записи плюс `action`
        и `applied`. Порядок проверок: роль → тело → `baseRev` → поля
        (`ops_field_required:<поле>`, `ops_field_invalid:<поле>`) → «не найдено» → полная
        запись (здесь же `rev_conflict`).

        **`upsertItem`** — добавить задачу в состав роли либо обновить её. Роль: редактор.
        Задача с тем же `issueId` в составе роли обновляется слиянием (присланные ключи
        заменяют, остальные сохраняются), иначе добавляется в конец. `item.issueId`
        обязателен и должен иметь вид `DEMO-101`; новой задаче достаточно `issueId` —
        остальное дополнит обогащение. В `applied` — `{ roleKey, issueId, created }`
        (`created: true` — задача добавлена, `false` — обновлена). Отказы:
        `ops_field_required:<поле>` (`roleKey`, `item`, `issueId`), `ops_field_invalid:<поле>`
        (`roleKey`, `issueId`); от полной записи — `invalid_role_items_structure`
        (неизвестный ключ задачи, больше 1000 задач на роль), `reason_required`,
        `reason_too_long`, `role_items_data_too_large`.

        **`removeItem`** — убрать задачу из состава роли. Роль: редактор. В `applied` —
        `{ roleKey, issueId }`. Отказы: `ops_field_required:<поле>` и
        `ops_field_invalid:<поле>` (`roleKey`, `issueId`), `item_not_found` — задачи нет в
        составе этой роли.

        **`patchSprint`** — изменить часть ключей шапки спринта в слоте (название, даты,
        статус, цель, ресурсы ролей и др.). Роль: редактор. Присланные ключи сливаются в
        хранимый спринт. `sprintId` допускается только равным хранимому
        (`ops_field_invalid:sprintId`). Серверные ключи — `updatedBy`, `updatedAt`,
        `pluginVersion`, `_rev`, `migrationLog`, `personalPlanning`, `phases*` — отбрасываются
        молча; неизвестный ключ не отбрасывается, а даёт `invalid_sprint_structure`.
        Создать спринт этой операцией нельзя — пустой слот отвечает `sprint_not_found`,
        создание выполняется полной записью. В `applied` — `{ sprintId, keys: […] }`
        (ключи, которые реально применены). Прочие отказы: `ops_field_required:sprint`,
        `sprint_data_too_large`.

        **`assignPerson`** — назначить человека на задачу роли, снять назначение, задать
        даты работы. Роль: распределяющий (`assigner_rights_required`). `login` — логин
        либо `null` (снять человека); даты — `dateStart`/`dateEnd` (epoch ms, `null` —
        снять дату); запись без единого значения удаляется. Отображаемое имя сервер берёт
        из ресурсов роли (нет — логин). Операция пишет в два места: сначала копию
        распределения в слоте (здесь сверяется `baseRev` — отказ приходит до любой
        записи), затем запись роли `<sprintId>_<roleKey>` в истории — именно её читает
        интерфейс планера. Записи роли в истории ещё нет (она появляется, когда роль
        отправлена на согласование либо спринт запущен) — `role_record_not_found`. Сбой
        второй записи оставляет слот впереди истории — это безвредно, повтор операции со
        свежей ревизией выравнивает. В `applied` — `{ roleKey, issueId, assignee }`
        (`assignee` — присланный `login`, в том числе `null`); ответ дополнительно несёт
        `historyRev` — новую ревизию истории. Отказы: `ops_field_required:<поле>`
        (`roleKey`, `issueId`), `ops_field_invalid:<поле>` (`roleKey`, `issueId`, `login` —
        в том числе когда ключ не передан, `dateStart`, `dateEnd`), `sprint_not_found`,
        `role_record_not_found`; от полных записей — `invalid_sprint_structure`,
        `sprint_data_too_large`, `invalid_history_structure`, `history_data_too_large`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [validate, assignerSync, phases, upsertItem, removeItem, patchSprint, assignPerson]
          description: Вариант записи; не передан — полная запись. Мелкие операции (последние четыре) — с 3.49.0
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RoleKey"
          description: Только при `action=validate` — роль, по которой считается перелимит; не передан либо неизвестен — все роли
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - title: без action
                  allOf:
                    - $ref: "#/components/schemas/PostSprintDataRequest"
                - $ref: "#/components/schemas/SprintValidateRequest"
                - $ref: "#/components/schemas/SprintAssignerSyncRequest"
                - $ref: "#/components/schemas/SprintPhasesRequest"
                - $ref: "#/components/schemas/UpsertItemRequest"
                - $ref: "#/components/schemas/RemoveItemRequest"
                - $ref: "#/components/schemas/PatchSprintRequest"
                - $ref: "#/components/schemas/AssignPersonRequest"
            examples:
              fullWrite:
                summary: без action — заливка черновика спринта
                value:
                  baseRev: 25
                  sprint:
                    sprintId: "sprint-2026-10"
                    name: "Спринт октябрь 2026"
                    status: "PLANNING"
                    dateStart: 1791158400000
                    dateEnd: 1792108800000
                    sprintGoal: "Закрыть блок отчётности"
                    sprintFieldVal: "Октябрь 2026"
                    resourceAnalysis: 52920
                    resourceDevPlatform: 16470
                  roleItems:
                    analysis:
                      - issueId: "DEMO-101"
                        url: "https://youtrack.example.local/issue/DEMO-101"
                        title: "Аналитика по переносу остатков"
                        priority: "Major"
                        state: "Открыта"
                        system: "Учётная система"
                        inclusionStatus: "INC_PLANNED"
                        estimate_analysis: 1680
                    devPlatform:
                      - issueId: "DEMO-102"
                        url: "https://youtrack.example.local/issue/DEMO-102"
                        title: "Доработка обмена с внешней системой"
                        priority: "Normal"
                        state: "Открыта"
                        inclusionStatus: "INC_PLANNED"
                        estimate_devPlatform: 960
              upsertItem:
                summary: action=upsertItem — добавить задачу в состав роли (остальное дополнит сервер)
                value:
                  roleKey: analysis
                  item:
                    issueId: "DEMO-103"
                    url: "https://youtrack.example.local/issue/DEMO-103"
                    inclusionStatus: "INC_PLANNED"
                    estimate_analysis: 480
                  baseRev: 26
              patchSprint:
                summary: action=patchSprint — сменить цель и дату окончания спринта
                value:
                  sprint:
                    sprintGoal: "Закрыть блок отчётности и перенос остатков"
                    dateEnd: 1792108800000
                  baseRev: 27
              assignPerson:
                summary: action=assignPerson — назначить человека на задачу и задать даты работы
                value:
                  roleKey: analysis
                  issueId: "DEMO-101"
                  login: "ivanov"
                  dateStart: 1791244800000
                  dateEnd: 1791504000000
                  baseRev: 28
              phases:
                summary: action=phases — задать две фазы, третью пометить «не планируется»
                value:
                  sprint:
                    sprintId: "sprint-2026-10"
                    phases:
                      analysis: { dateStart: 1791158400000, dateEnd: 1791504000000 }
                      development: { dateStart: 1791244800000, dateEnd: 1791936000000 }
                      deploy: null
                  baseRev: 29
      responses:
        "200":
          description: |
            Результат записи — успех, конфликт ревизий или прикладная ошибка;
            HTTP-статус во всех случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PostSprintDataOk"
                  - $ref: "#/components/schemas/SprintAssignerSyncOk"
                  - $ref: "#/components/schemas/SprintPhasesOk"
                  - $ref: "#/components/schemas/OpsOk"
                  - $ref: "#/components/schemas/RevConflict"
                  - $ref: "#/components/schemas/AppError"

  /app-version:
    get:
      operationId: getAppVersion
      tags: [Спринт]
      summary: Версия установленного плагина
      description: |
        Версия приложения планера, установленного в инстансе, — для сверки с `info.version`
        этого контракта перед работой интеграции. Доступна по обоим адресам: по основному
        (по ключу проекта) `projectKey` не нужен и права на проект не проверяются —
        достаточно действующего токена; по проектному — факт аутентификации + доступ к
        проекту. С 3.49.0 ответ несёт `success: true` (раньше — только `version`).
        Ничего не пишет.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: Версия либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AppVersionOk"
                  - $ref: "#/components/schemas/AppError"

  /filter-planner-projects:
    servers:
      - url: "{baseUrl}/api/extensionEndpoints/smart-sprint-planner/backend-global"
        description: Только основной адрес; параметр `projectKey` не нужен
        variables:
          baseUrl:
            default: https://youtrack.example.local
            description: Базовый URL инстанса YouTrack (без завершающего /) — заглушка, подставьте свой
    post:
      operationId: filterPlannerProjects
      tags: ["Доступ"]
      summary: Какие из переданных проектов — с подключённым планером и видны вызывающему (3.51.0)
      description: |
        Принимает ключи проектов и возвращает те из них, где подключён планер и которые
        вызывающий вправе читать. Перечень проектов инстанса операция не отдаёт — его берут
        штатным REST YouTrack (`GET {baseUrl}/api/admin/projects?fields=shortName,name`) либо
        инструментами MCP YouTrack и передают ключи сюда. Ответ всегда актуален: сервер
        проверяет каждый ключ при каждом вызове и ничего не запоминает. Так же работает выбор
        проекта в главном меню планера — операция существовала и раньше, в контракт внесена
        в 3.51.0.

        **Адрес** — только основной и без `projectKey`:
        `{baseUrl}/api/extensionEndpoints/smart-sprint-planner/backend-global/filter-planner-projects`.
        По проектному адресу операции нет (404 `HTTP handler not found`).

        **«Планер подключён»** — в проекте сохранялись настройки планера либо задана группа
        управления настройками и планер хотя бы раз открывали в проекте. Ключ проекта без
        доступа у вызывающего, несуществующий, недопустимой формы, не строка и повтор
        пропускаются молча — отказа по ним нет, в ответ они не попадают. Проект с отключённым
        планером (`POST /planner-disabled`) виден только тому, кто вправе включить его обратно
        (управление настройками, администратор YouTrack), и помечен `disabled: true`.

        **Лимиты:** тело до 256 КБ (иначе `too_large`); обрабатываются первые 5000 ключей,
        остальные отбрасываются без отказа. Порядок ответа — по названию проекта.

        **Роль** — любой аутентифицированный пользователь. Ничего не меняет. Отказы:
        `auth_required`, `invalid_keys` (`keys` не массив), `too_large`, `invalid_json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterPlannerProjectsRequest"
            example:
              keys: ["DEMO", "SP", "TEST"]
      responses:
        "200":
          description: |
            Проекты с планером либо прикладная ошибка (`success:false`) — HTTP-статус в обоих
            случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/FilterPlannerProjectsOk"
                  - $ref: "#/components/schemas/AppError"

  /my-roles:
    get:
      operationId: getMyRoles
      tags: ["Доступ"]
      summary: Роли вызывающего в проекте по группам планера (3.51.0)
      description: |
        Какие роли планера есть у пользователя токена в проекте — чтобы интеграция заранее
        знала, какие записи ей доступны, а не узнавала об этом отказом. Ответ собран из тех же
        проверок, которыми сервер пропускает запись; своей модели прав у операции нет.

        **Ключи `roles`** (true — роль есть): `editor` — редактор, `assigner` —
        распределяющий, `validator` — согласующий, `historyManager` — управление историей,
        `settingsManager` — управление настройками, `planningManager` — планировочный
        менеджер, `releaseManager` — релиз-менеджер, `releaseEngineer` — релиз-инженер,
        `sprintLockManager` — блокировка создания спринтов. Роль — это членство в группе,
        а не право операции: часть операций допускает несколько ролей (распределение —
        также редактору, управлению настройками и релиз-ролям; запись релизов — также
        управлению настройками). Роль каждой операции названа в её описании.

        **Администратор YouTrack** (`instanceAdmin: true`) получает все роли, кроме
        управления историей: очистка и замена истории требуют явного членства в группе
        и от администратора.

        **`configured: false`** — в настройках приложения в проекте не задана группа
        управления настройками: запись закрыта всем, кроме администратора YouTrack, роли —
        false. По основному адресу признак берётся из копии, которую планер сохраняет при
        открытии в проекте, — как у любой записи по этому адресу.

        **`disabled`** — планер отключён в проекте. По основному адресу отключённый проект
        отвечает отказом `planner_disabled` раньше этой операции, поэтому `disabled: true`
        видно только по проектному адресу.

        **Роль** — участник проекта. Ничего не меняет. Отказы: `auth_required`; по основному
        адресу также `invalid_project_key`, `project_unavailable`, `planner_disabled`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: Роли либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/MyRolesOk"
                  - $ref: "#/components/schemas/AppError"

  /history:
    get:
      operationId: getHistory
      tags: [История]
      summary: История спринтов проекта и её ревизия
      description: |
        Возвращает все записи истории спринтов и текущую ревизию истории. Запись истории —
        снимок спринта по одной роли; её идентификатор `sprintId` составной:
        `<id спринта>_<roleKey>`. Ревизия — `rev` ответа: это `baseRev` записей истории
        (`POST /history` без `action` и `snapshot`). Историю меняют также
        `POST /sprint-data?action=phases` и `assignPerson` — после них `rev` нужно
        перечитать (либо взять `historyRev` из их ответа).
        Ответ большой: до 500 записей, у каждой — состав задач, персональное распределение,
        ревизии и настройки проекта на момент снимка (включая группы по ролям и ставки) —
        принятая модель доверия. Значения перечислений прежних редакций приводятся к
        латинским кодам на чтении; хранимые данные при этом не меняются.
        Права: факт аутентификации + доступ к проекту. Ничего не пишет.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: История либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HistoryOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: postHistory
      tags: [История]
      summary: "⚠ Ограниченная: запись истории спринтов — полная замена, очистка, запись одной записи, восстановление из копии"
      x-restricted: true
      description: |
        > ⚠ **Ограниченная операция.** Опасна любая запись по этому пути: без `action` и
        > `import-replace` заменяют **всю** историю проекта присланным массивом, `clear`
        > стирает её необратимо, `snapshot` подменяет запись целиком — в том числе запись
        > завершённого спринта. Мелких операций у истории нет. Штатно историю ведёт
        > интерфейс планера; интеграции запись сюда нужна только для переноса и
        > восстановления данных. Роли: согласующий (без `action`), редактор либо
        > согласующий (`snapshot`), управление историей (`clear`, `import-replace`).

        Вариант выбирает query-параметр `action`; неизвестное значение — `invalid_action`.
        Отказы прав, общие для всех вариантов, — `auth_required` и `plugin_not_configured`.
        Роль управления историей требует явного членства в группе: администратор инстанса
        вне этой группы получает `history_manager_rights_required` — единственное
        исключение из его полного доступа.

        **Ревизия** — `rev` из `GET /history`. Запись без `action` и `snapshot` требуют
        числовой `baseRev` — иначе `base_rev_required` (обязателен с 3.49.0; раньше запись
        без него шла без защиты от гонок). Ревизия разошлась — `rev_conflict` с текущим
        `rev`, ничего не записано. У `clear` и `import-replace` ревизии нет по замыслу.
        Каждая успешная запись увеличивает ревизию; новое значение — `rev` ответа.

        **Лимиты и проверка.** Не более 500 записей, 1000 задач и 1000 ревизий на запись;
        сериализованная история ≤ 1 МБ (`history_data_too_large`). Запись проверяется по
        схеме `HistoryRecord`, неизвестный ключ — отказ. Код отказа
        `invalid_history_structure: <где>` сравнивается по началу строки: после двоеточия —
        диагностика для человека с номером записи (может содержать присланные значения),
        разбирать её не нужно.

        **без `action` — полная замена.** Роль: согласующий (`validator_rights_required`).
        Хранимая история заменяется массивом `history` целиком: записи, которых нет в
        теле, исчезают. Если массив короче хранимого более чем на одну запись, нужна ещё и
        роль управления историей (`history_manager_rights_required`). Сервер сам ставит
        `confirmedBy` и `finishedBy` (значение, изменившееся относительно хранимого,
        заменяется именем автора запроса), `revisions[].by` у новых ревизий (логин автора
        запроса) и `pluginVersion`; ключи `phases*` берутся из хранимых записей (фазы пишет
        только `POST /sprint-data?action=phases`). `baseRev` проверяется первым. Тело без
        `history` — отказ `invalid_history_structure: missing` (3.49.1; раньше такой запрос
        отвечал успехом без записи). Прочие отказы: `invalid_history_structure: <где>`
        (в том числе `invalid_history_structure: not_array`).

        **`clear`** — очистка истории. Роль: управление историей. Тело не читается,
        ревизия не сверяется. История проекта становится пустой — **необратимо**: вернуть
        её можно только `import-replace` из заранее сохранённой копии (ответ
        `GET /history`). Ответ несёт `cleared: true` и новый `rev`.

        **`snapshot`** — запись ровно одной записи истории. Роль: редактор либо
        согласующий (`editor_rights_required`). Тело `{ "history": [ <одна запись с
        непустым sprintId> ], "baseRev" }` — иначе `invalid_snapshot_body`. Запись с тем же
        `sprintId` **заменяется целиком** (слияния нет; статус `FINISHED` не защищает),
        новая добавляется в начало; другие записи не удаляются. Серверные штампы и фазы —
        как у полной замены. После вставки проверяется вся история: одна некорректная
        старая запись блокирует запись новой (`invalid_history_structure: <где>`).

        **`import-replace`** — восстановление истории из резервной копии. Роль: управление
        историей. История заменяется массивом `history` целиком; `baseRev` не сверяется.
        ⚠ Серверные штампы не ставятся: `confirmedBy`, `finishedBy`, `revisions[].by` и
        `phases*` принимаются от клиента как есть — восстановление обязано сохранить
        исходную атрибуцию, поэтому после него она достоверна лишь настолько, насколько
        достоверна копия. Ответ несёт `count` — число записанных записей. Отказы:
        `invalid_history_structure` (в `history` не массив), `invalid_history_structure: <где>`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [clear, snapshot, import-replace]
          description: Вариант записи; не передан — полная замена истории
      requestBody:
        required: false
        description: Обязательно для всех вариантов, кроме `clear` (его тело не читается)
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/HistoryReplaceRequest"
                - $ref: "#/components/schemas/HistorySnapshotRequest"
                - $ref: "#/components/schemas/HistoryImportReplaceRequest"
            examples:
              snapshot:
                summary: action=snapshot — записать одну запись роли
                value:
                  baseRev: 12
                  history:
                    - sprintId: "sprint-2026-10_analysis"
                      name: "Спринт октябрь 2026"
                      status: "CONFIRMED"
                      roleKey: analysis
                      roleLabel: "Аналитика"
                      dateStart: 1791158400000
                      dateEnd: 1792108800000
                      confirmedBy: "Иванов Иван"
                      confirmedAt: 1791244800000
                      resourceAnalysis: 52920
                      items:
                        - issueId: "DEMO-101"
                          url: "https://youtrack.example.local/issue/DEMO-101"
                          title: "Аналитика по переносу остатков"
                          inclusionStatus: "INC_PLANNED"
                          estimate_analysis: 1680
      responses:
        "200":
          description: |
            Результат записи — успех, конфликт ревизий или прикладная ошибка;
            HTTP-статус во всех случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HistoryWriteOk"
                  - $ref: "#/components/schemas/RevConflict"
                  - $ref: "#/components/schemas/AppError"

  /capacity:
    get:
      operationId: getCapacity
      tags: ["Ёмкость"]
      summary: Запись ёмкости спринта
      description: |
        Возвращает сохранённую запись ёмкости одного спринта: состав участников с грейдами,
        ставками, долей участия и распределением по ролям, рассчитанную сервером базу в часах,
        входы, замороженные при утверждении (коэффициенты грейдов, ссылка на календарь,
        применённые отсутствия), и статус утверждения. Дополнительно — `archivedCount`, число
        записей в архиве ёмкости (`GET /capacity-archive`).

        `sprintId` необязателен. Без него, а также для спринта, у которого записи ёмкости нет,
        ответ успешный с `capacity: null` — это не отказ.

        Роль — участник проекта. Модель доверия: грейды, ставки и отсутствия сотрудников читает
        любой участник проекта — учитывайте это, выдавая токен внешней системе.
        Ревизии у ёмкости нет. Операция ничего не меняет.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
        - name: sprintId
          in: query
          required: false
          schema: { type: string }
          description: |
            Идентификатор спринта — `sprint.sprintId` из `GET /sprint-data`.
            Не передан — `capacity: null`.
          example: sprint-2026-11
      responses:
        "200":
          description: |
            Запись ёмкости либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CapacityOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: postCapacity
      tags: ["Ёмкость"]
      summary: Сохранение и утверждение ёмкости текущего спринта; точечная правка участника (3.49.0)
      description: |
        Запись ёмкости **текущего спринта проекта**. Клиент присылает только примитивы участников —
        грейд, ставку, долю участия и распределение по ролям. Базу в часах, применённые отсутствия,
        коэффициенты, окно спринта и автора утверждения сервер считает и штампует сам: присланные
        значения этих ключей игнорируются. База участника = (рабочие часы спринта по производственному
        календарю − часы его отсутствий) × коэффициент грейда × `rate` × `participation`; ёмкость
        роли — сумма баз, умноженных на долю роли.

        Общие правила всех действий. `sprintId` обязателен (`sprint_id_required`) и обязан совпадать
        с идентификатором спринта в рабочем слоте — взять из `GET /sprint-data`; для другого спринта
        ответ `sprint_not_current`. У спринта должны быть даты начала и окончания
        (`sprint_dates_missing`). Ревизии у ёмкости нет: `baseRev` не требуется и не сверяется,
        действует правило «последняя запись побеждает». Параметр `action` не передан — выполняется
        `save`; неизвестное значение — `invalid_action`. Роль для всех действий — управление
        настройками либо планировочный менеджер (иначе `settings_manager_rights_required`; группа
        управления настройками в проекте не задана — `plugin_not_configured`). Когда активный набор
        записей ёмкости перерастает порог, самые старые по дате окончания записи (кроме текущего
        спринта) автоматически уходят в архив — их число в ключе `archived` ответа.

        **`save`** (по умолчанию) — сохранить ёмкость спринта. ⚠ Полная замена состава участников
        записи: участник, которого нет в `persons`, из записи исчезает; `persons: {}` записывает
        пустой состав. Для правки одного участника пользуйтесь `upsertPerson`. На новой либо
        неутверждённой записи статус — `draft`. На утверждённой записи это «живая правка»: статус
        остаётся `approved`, выставляется признак `dirty: true` («изменено после утверждения»), автор
        и время утверждения сохраняются, база пересчитывается (по замороженным коэффициентам и
        текущим календарю и отсутствиям), а замороженные ключи `calendarRef` и `absencesApplied` не
        обновляются до переутверждения. Сумма долей участника больше 100 % сохранению не мешает —
        в ответе `allocOk: false`. Свои отказы:
        `capacity_persons_required` (в теле нет объекта `persons`), `invalid_capacity_structure`
        (форма записи, в том числе ключ распределения вне набора ролей и числа вне 0..1),
        `capacity_data_too_large`.

        **`approve`** — утвердить ёмкость. Тело то же, что у `save`. Сервер замораживает входы
        (коэффициенты грейдов и часы дня из настроек проекта, ссылку на календарь, отсутствия в окне
        спринта), ставит `status: approved`, `dirty: false`, `approvedBy` — пользователь токена,
        `approvedAt` — текущее время, журнал переутверждений очищает. Свой отказ —
        `alloc_sum_exceeds_100` (у кого-то из участников сумма долей по ролям больше 100 %); плюс
        все отказы `save`.

        **`reapprove`** — переутвердить ранее утверждённую ёмкость: заморозка входов обновляется,
        `dirty` снимается, исходное `approvedAt` сохраняется, в `reapprovals` дописывается
        `{by, at}`. Прежний замороженный снимок после этого не восстановить. Утверждённой записи
        нет — действие работает как первое `approve`, отказа нет. Отказы — как у `approve`, включая
        `alloc_sum_exceeds_100`.

        **`upsertPerson`** (3.49.0) — мелкая операция: добавить участника либо обновить его параметры,
        не пересылая весь состав. Тело — `{login, person}`. Сервер берёт хранимую запись ёмкости
        спринта, сливает ключи `person` в параметры участника (поверхностно: присланный `alloc`
        заменяет карту распределения целиком, неприсланные ключи сохраняются), нового участника
        создаёт — и сохраняет результат по правилам `save`, включая `dirty: true` на утверждённой
        записи. Записи ёмкости у спринта ещё нет — она создаётся с одним участником, как при первом
        сохранении. Ревизии нет — `baseRev` не требуется (присланный отбрасывается). Ответ — `OpsOk`:
        конверт `save` (`sprintId`, `capacity`, `allocOk`, `archived`) плюс `action: "upsertPerson"` и
        `applied: {sprintId, login, created}`, где `created: true` — участник добавлен, `false` —
        обновлён. Свои отказы: `ops_field_required:login`, `ops_field_required:person`,
        `ops_field_invalid:login` (не строка 1..200 символов); наследуются от `save` —
        `sprint_id_required`, `sprint_not_current`, `sprint_dates_missing`,
        `invalid_capacity_structure`, `capacity_data_too_large`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [save, approve, reapprove, upsertPerson]
            default: save
          description: "Вариант записи; не передан — `save`. `upsertPerson` — с 3.49.0."
        - name: sprintId
          in: query
          required: true
          schema: { type: string }
          description: "Идентификатор текущего спринта проекта (`sprint.sprintId` из `GET /sprint-data`)."
          example: sprint-2026-11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/CapacitySaveRequest"
                - $ref: "#/components/schemas/UpsertPersonRequest"
            examples:
              save:
                summary: "save / approve / reapprove — весь состав участников"
                value:
                  persons:
                    ivanov:
                      grade: Senior
                      rate: 1
                      participation: 1
                      alloc: { analysis: 0.4, devBack: 0.6 }
                    petrova:
                      grade: Middle
                      rate: 0.5
                      participation: 0.8
                      alloc: { testing: 1 }
              upsertPerson:
                summary: "upsertPerson (3.49.0) — один участник"
                value:
                  login: petrova
                  person:
                    participation: 0.5
      responses:
        "200":
          description: |
            Результат записи либо прикладная ошибка (`success:false`) — HTTP-статус во всех случаях 200.
            `save`, `approve`, `reapprove` отвечают `CapacityOk`, `upsertPerson` — `OpsOk`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CapacityOk"
                  - $ref: "#/components/schemas/OpsOk"
                  - $ref: "#/components/schemas/AppError"

  /capacity-archive:
    get:
      operationId: getCapacityArchive
      tags: ["Ёмкость"]
      summary: Архив ёмкости прошлых спринтов
      description: |
        Записи ёмкости, автоматически вытесненные из активного набора (см. `POST /capacity`).
        Только чтение: записать в архив либо вернуть запись из архива нельзя. Ответ — весь архив
        одним массивом в ключе `capacity` (до ≈480 КБ), свежие по `dateEnd` первыми; каждая запись
        несёт свой `sprintId`. Параметров нет.

        Роль — участник проекта. Модель доверия та же, что у `GET /capacity`: грейды, ставки и
        отсутствия сотрудников за всю историю проекта читает любой участник проекта, одним запросом.
        Операция ничего не меняет.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Архив ёмкости либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CapacityArchiveOk"
                  - $ref: "#/components/schemas/AppError"

  /calendar:
    get:
      operationId: getCalendar
      tags: ["Календарь и отсутствия"]
      summary: Производственный календарь проекта
      description: |
        Праздничные, сокращённые и перенесённые рабочие дни по годам — исключения из правила по
        умолчанию: суббота и воскресенье — выходные, остальные дни — рабочие. `calendar: null` —
        календарь в проекте ещё не загружали. Отдаётся целиком (до 300 КБ), вместе с логином
        загрузившего и временем загрузки.

        Роль — участник проекта. Ревизии у календаря нет. Операция ничего не меняет.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Календарь либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CalendarOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: postCalendar
      tags: ["Календарь и отсутствия"]
      summary: "⚠ Ограниченная: полная замена производственного календаря проекта"
      x-restricted: true
      description: |
        > ⚠ **Ограниченная операция.** Производственный календарь проекта заменяется **целиком**:
        > записывается ровно то, что пришло в `years`; год, которого нет в теле, стирается. Тело без
        > `years` (в том числе пустое) отклоняется — `calendar_invalid`, поле `years`, код
        > `not_object` (3.49.1; раньше такой запрос записывал пустой календарь); явный пустой
        > `years: {}` — осознанная очистка календаря. Частичного обновления и мелких
        > операций у календаря нет, ревизии нет (последняя запись побеждает), прежний календарь не
        > сохраняется — вернуть его можно только повторной загрузкой. Ошибка в календаре искажает
        > расчёт ёмкости проекта при следующих сохранениях и утверждениях. Роль — управление
        > настройками.

        Безопасный порядок: `GET /calendar` → изменить нужные дни → прислать календарь целиком.
        Из тела используется только `years`; `uploadedBy`, `uploadedAt`, `pluginVersion` сервер
        проставляет сам (присланные значения перезаписываются), прочие ключи отбрасываются. Ответ —
        нормализованный календарь: у каждого дня только `date`, `type`, `hoursDelta` (у `holiday` и
        `workday` — 0).

        Отказы роли — `settings_manager_rights_required`; группа управления настройками в проекте не
        задана — `plugin_not_configured`. Параметра `action` у операции нет.

        Проверка атомарная: одна ошибка — отклонён весь календарь, ничего не записано. Отказ
        `calendar_invalid` несёт `errors[]` — записи `{year?, index?, field, code}` (год, номер дня в
        массиве года, имя поля; значения из тела не возвращаются). Вложенные коды `errors[].code`:
        - `not_object` — тело, `years` либо запись дня не объект (`field` — `root`, `years`, `entry`);
        - `invalid_year` — ключ года не четыре цифры;
        - `not_array` — значение года не массив;
        - `invalid_date` — `date` не существующая календарная дата `YYYY-MM-DD`;
        - `year_mismatch` — год даты не совпадает с ключом года;
        - `invalid_type` — `type` не из `holiday`, `short`, `workday`;
        - `invalid_delta` — у дня `short` `hoursDelta` вне диапазона −8 … −0.5;
        - `delta_must_be_zero` — у дня `holiday` либо `workday` `hoursDelta` не равен 0;
        - `duplicate_date` — дата повторяется в пределах года.

        Второй свой отказ — `calendar_data_too_large` (календарь после сериализации больше 300 КБ).
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Calendar"
            example:
              years:
                "2026":
                  - { date: "2026-11-03", type: short, hoursDelta: -1 }
                  - { date: "2026-11-04", type: holiday, hoursDelta: 0 }
                  - { date: "2026-12-31", type: holiday }
                "2027":
                  - { date: "2027-01-01", type: holiday }
                  - { date: "2027-02-20", type: workday }
      responses:
        "200":
          description: |
            Записанный календарь либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CalendarOk"
                  - $ref: "#/components/schemas/AppError"

  /absences:
    get:
      operationId: getAbsences
      tags: ["Календарь и отсутствия"]
      summary: Реестр отсутствий сотрудников проекта
      description: |
        Отпуска, больничные, обучение и прочие отсутствия по всем сотрудникам проекта: карта
        «логин → список записей». Отдаётся целиком (до 300 КБ). Сотрудника без отсутствий в карте
        нет; реестр ни разу не записывали — `absences: {}` и `rev: 0`.

        Ревизия реестра — ключ `rev` ответа: его значение передаётся как `baseRev` в любую запись
        `POST /absences`.

        Роль — участник проекта. Модель доверия: даты и типы отсутствий всех сотрудников, включая
        больничные, читает любой участник проекта. Операция ничего не меняет.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Реестр отсутствий либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AbsencesOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: postAbsences
      tags: ["Календарь и отсутствия"]
      summary: "Запись отсутствий — точечные операции (3.49.0); ⚠ полная замена — ограниченная"
      description: |
        Запись реестра отсутствий проекта. Отсутствия уменьшают базу участника при расчёте ёмкости.
        Сохранённые записи ёмкости от записи отсутствий сами не меняются — пересчёт происходит при
        следующей записи `POST /capacity`.

        Общие правила всех вариантов. Реестр — данные с ревизией: тело обязано нести числовой
        `baseRev` — значение `rev` из `GET /absences` либо из ответа предыдущей записи; без него —
        `base_rev_required`. Ревизия разошлась с серверной — `rev_conflict` с текущим `rev`, ничего
        не записано: перечитать `GET /absences` и повторить. Каждая успешная запись увеличивает `rev`
        на 1. Роль — управление настройками либо планировочный менеджер (иначе
        `settings_manager_rights_required`; группа управления настройками в проекте не задана —
        `plugin_not_configured`). Непустой неизвестный `action` — `invalid_action` (3.49.0; прежде
        параметр на этом пути игнорировался).

        Порядок проверок: роль → `action` → разбор тела → `baseRev` → поля мелкой операции → сверка
        ревизии → форма записей → размер. Проверка формы атомарная: одна ошибка — отклонён весь
        запрос. Отказ `absences_invalid` несёт `errors[]` — записи `{login?, index?, field, code}`
        (логин, номер записи в списке сотрудника, имя поля; значения из тела не возвращаются).
        Вложенные коды `errors[].code`:
        - `not_object` — реестр либо запись отсутствия не объект (`field` — `root`, `entry`);
        - `invalid_login` — логин пустой либо длиннее 200 символов;
        - `not_array` — значение по логину не массив;
        - `invalid_date` — `from` либо `to` не существующая календарная дата `YYYY-MM-DD`;
        - `from_after_to` — `from` позже `to`;
        - `invalid_type` — `type` не из перечня типов отсутствия;
        - `invalid_delta` — `hoursDelta` вне диапазона 0.5 … 24.

        Общий для всех вариантов отказ размера — `absences_data_too_large` (реестр после
        сериализации больше 300 КБ).

        **`upsertAbsence`** (3.49.0) — мелкая операция: добавить отсутствие сотрудника либо заменить
        существующее. Тело — `{login, entry, baseRev}`. Запись с той же парой `from` + `to` у этого
        сотрудника **заменяется присланной целиком** (не слияние ключей: непереданный `hoursDelta`
        исчезает), иначе запись добавляется в конец списка. Отсутствия остальных сотрудников не
        затрагиваются. Ответ — `OpsOk`: `rev` плюс `action: "upsertAbsence"` и
        `applied: {login, from, to, created}`, где `created: true` — добавлена, `false` — заменена.
        Свои отказы: `ops_field_required:login`, `ops_field_required:entry`,
        `ops_field_invalid:login`; форма записи проверяется общей проверкой реестра —
        `absences_invalid` с `errors[]`.

        **`removeAbsence`** (3.49.0) — мелкая операция: удалить одно отсутствие сотрудника. Тело —
        `{login, from, to, baseRev}`; запись ищется по точному совпадению пары `from` + `to`. Если
        удалена последняя запись сотрудника, его логин уходит из реестра целиком. Ответ — `OpsOk`:
        `rev` плюс `action: "removeAbsence"` и `applied: {login, from, to}`. Свои отказы:
        `ops_field_required:login`, `ops_field_required:from`, `ops_field_required:to`,
        `ops_field_invalid:login`, `absence_not_found` (у сотрудника нет отсутствия с такими датами,
        в том числе когда сотрудника нет в реестре).

        **без `action`** — полная замена реестра.

        > ⚠ **Ограниченная операция.** Реестр отсутствий **всех сотрудников** заменяется целиком:
        > сотрудник, которого нет в присланной карте, теряет все отсутствия; пустая обёртка
        > `{absences: {}, baseRev}` очищает реестр. Архива у реестра нет — стёртое не вернуть.
        > Клиент, которому нужно изменить отсутствие одного человека, обязан пользоваться
        > `upsertAbsence` и `removeAbsence`; полная замена — только для первичной загрузки и
        > синхронизации реестра из кадровой системы целиком. Роль — управление настройками либо
        > планировочный менеджер.

        Принимается только обёртка `{absences, baseRev}` (3.49.0): «сырая» карта «логин → записи» без
        обёртки, пустое тело и обёртка без числового `baseRev` отвечают `base_rev_required` — ничего
        не записано. Ответ — `AbsencesOk` с новым `rev` (без ключа `absences`).
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [upsertAbsence, removeAbsence]
          description: "Мелкая операция (3.49.0); не передан — ⚠ полная замена реестра."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/UpsertAbsenceRequest"
                - $ref: "#/components/schemas/RemoveAbsenceRequest"
                - $ref: "#/components/schemas/AbsencesRequest"
            examples:
              upsertAbsence:
                summary: "upsertAbsence (3.49.0) — отпуск одного сотрудника"
                value:
                  login: ivanov
                  entry: { from: "2026-11-09", to: "2026-11-13", type: vacation }
                  baseRev: 7
              removeAbsence:
                summary: "removeAbsence (3.49.0)"
                value:
                  login: ivanov
                  from: "2026-11-09"
                  to: "2026-11-13"
                  baseRev: 8
              replaceAll:
                summary: "⚠ без action — полная замена реестра всех сотрудников"
                value:
                  baseRev: 7
                  absences:
                    ivanov:
                      - { from: "2026-11-09", to: "2026-11-13", type: vacation }
                    petrova:
                      - { from: "2026-11-16", to: "2026-11-16", type: training, hoursDelta: 4 }
      responses:
        "200":
          description: |
            Результат записи, конфликт ревизий либо прикладная ошибка — HTTP-статус во всех случаях 200.
            Полная замена отвечает `AbsencesOk`, мелкие операции — `OpsOk`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AbsencesOk"
                  - $ref: "#/components/schemas/OpsOk"
                  - $ref: "#/components/schemas/RevConflict"
                  - $ref: "#/components/schemas/AppError"

  /releases:
    get:
      operationId: getReleases
      tags: ["Релизы"]
      summary: Активный реестр релизов проекта, права вызывающего и ревизия реестра
      description: |
        Возвращает активный реестр релизов проекта: записи релизов (`releases`), права
        вызывающего на запись (`perms`), число записей в архиве (`archivedCount`) и ревизию
        реестра (`rev`). Закрытые релизы, переехавшие в архив, в ответ не входят — их отдаёт
        `GET /releases-archive`.

        **Ревизия.** `rev` ответа — значение `baseRev` для любой записи `POST /releases`
        (реестр ещё не записывался → 0).

        **Роль** — участник проекта. Переключатель модуля релизов в настройках проекта на
        ответ не влияет: данные отдаются и при выключенном модуле. Записи несут логины
        представителей релиза и авторов правок — они видны любому участнику проекта.
        Ничего не меняет. Отказы: `auth_required`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Реестр релизов либо прикладная ошибка (`success:false`) — HTTP-статус в обоих
            случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ReleasesOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: postReleases
      tags: ["Релизы"]
      summary: "Запись релизов: мелкие операции (3.49.0); ⚠ полная замена — ограниченная"
      description: |
        Реестр релизов проекта хранится одним блоком с ревизией. На этом пути — полная
        замена реестра (без `action`) и пять мелких операций (четыре с 3.49.0, `removeRelease` —
        с 3.51.0). Мелкая операция
        читает хранимый реестр, применяет одно изменение и проводит результат через ту же
        полную запись — права, проверки формы, лимиты, штампы аудита, авто-архив и правило
        релиз-инженера у всех вариантов одинаковы. Внешним клиентам рекомендуются мелкие
        операции: не нужно пересылать реестр целиком, нельзя случайно стереть чужие записи.
        Непустой неизвестный `action` → `invalid_action` (до 3.49.0 параметр игнорировался).

        **Ревизия.** Каждый вариант требует числовой `baseRev` — `rev` из `GET /releases`
        либо из ответа предыдущей записи; без него — `base_rev_required` (3.49.0, раньше
        запись шла без блокировки). Реестр изменён после вашего чтения → `rev_conflict`
        с текущим `rev`, ничего не записано: перечитать и повторить. Успешная запись
        увеличивает `rev`, даже если данные не изменились. Порядок проверок мелкой
        операции: наличие `baseRev` → поля тела и наличие релиза → сверка ревизии,
        поэтому устаревший `baseRev` с неизвестным `id` даст `release_not_found`.

        **Роли.** Релиз-менеджер (а также управление настройками) — все варианты.
        Релиз-инженер — только продвижение статуса на один шаг цепочки. Остальным, как
        и любому пользователю в проекте без настроенных групп ролей планера, —
        `release_rights_required`; без аутентификации — `auth_required`.

        **Цепочка статусов и правило релиз-инженера.** Рабочая цепочка: `planned`
        (запланирован) → `prep` (подготовка) → `work` (в работе) → `released` (выпущен).
        `cancelled` (отменён) — вне цепочки, отмена доступна только релиз-менеджеру.
        У релиз-инженера сервер сравнивает итоговый реестр с хранимым и отказывает
        (класс Forbidden), если отличие шире одного шага статуса:
        - `release_engineer_scope_record_count_change` — изменилось число записей (релиз
          добавлен либо удалён);
        - `release_engineer_scope_record_added` — при том же числе записей появился
          неизвестный `id` (запись подменена);
        - `release_engineer_scope_field_change` — изменилось любое поле, кроме `status`
          и `snapshot`: название, даты, заморозка, состав задач и прочее;
        - `release_engineer_scope_status_transition` — статус изменён не на следующий шаг
          цепочки: скачок, откат, отмена, выход из `released` либо `cancelled`;
        - `release_engineer_scope_snapshot_change` — `snapshot` изменён не вместе
          с переводом в `released`.

        Практически релиз-инженеру доступны `setReleaseStatus` на следующий статус цепочки
        либо `upsertRelease` с телом записи из `id` и следующего `status` (`snapshot` — только
        при переводе в `released`); любой другой изменённый ключ — отказ.

        **Общее для всех вариантов.** Аудит-поля записи ставит сервер, присланные значения
        не учитываются. Лимиты: до 500 записей, активный реестр до 400 КБ
        (`releases_too_large`). Авто-архив: когда активный реестр перерастает 300 КБ,
        старейшие закрытые релизы (`released`, `cancelled`) переезжают в архив — их число
        в ключе `archived` ответа; они исчезают из `GET /releases` и появляются
        в `GET /releases-archive`, вернуть релиз из архива нельзя. Задачи YouTrack запись
        релизов не трогает: состояния задач и теги по статусу релиза меняет интерфейс
        планера, внешний клиент делает это сам. Существование задач из `issues` сервер
        не проверяет; `freezeLocked` — хранимый признак, состав замороженного релиза
        сервер не блокирует.

        **`upsertRelease`** (3.49.0) — создать релиз либо обновить существующий · роль:
        релиз-менеджер; релиз-инженеру — только `id` и следующий `status` существующего
        релиза · тело `{ release, baseRev }`. Запись с тем же `id` обновляется
        ключами из тела — поверхностное слияние: ключи, которых в теле нет, сохраняются,
        убрать значение можно только явным `null`. Неизвестный `id` — релиз добавляется
        в конец реестра (статус нового релиза клиент задаёт сам, обычно `planned`) ·
        `applied: { id, created }`, `created: true` — релиз добавлен · отказы:
        `ops_field_required:release`, `ops_field_required:id`; ключ вне схемы `Release`,
        неверный тип либо длина значения — `invalid_releases_structure`; у релиз-инженера
        новый релиз — `release_engineer_scope_record_count_change`, иной изменённый ключ —
        `release_engineer_scope_field_change`.

        **`setReleaseStatus`** (3.49.0) — сменить статус релиза · роль: релиз-менеджер —
        любой статус, релиз-инженер — только следующий шаг цепочки · тело
        `{ id, status, snapshot?, baseRev }`. Меняет `status` и, если передан, `snapshot`
        (слепок закрытия; сервер проверяет только, что это объект) ·
        `applied: { id, status }` · отказы: `ops_field_required:id`,
        `ops_field_required:status`, `ops_field_invalid:status`, `release_not_found`;
        у релиз-инженера — `release_engineer_scope_status_transition`,
        `release_engineer_scope_snapshot_change`.

        **`addReleaseIssues`** (3.49.0) — добавить задачи в состав релиза · роль:
        релиз-менеджер · тело `{ id, issues, baseRev }`. Задачи дописываются в конец
        состава в порядке тела; уже входящие в состав и повторы пропускаются ·
        `applied: { id, added }` — фактически добавленные идентификаторы (пустой массив —
        все уже были в составе) · отказы: `ops_field_required:id`,
        `ops_field_required:issues`, `ops_field_invalid:issues` (не массив, больше 2000
        элементов, элемент — не строка в 1–64 символа), `release_not_found`; итоговый
        состав больше 2000 задач — `invalid_releases_structure`; у релиз-инженера —
        `release_engineer_scope_field_change`.

        **`removeReleaseIssues`** (3.49.0) — убрать задачи из состава релиза · роль:
        релиз-менеджер · тело `{ id, issues, baseRev }`. Перечисленные задачи убираются
        из состава; отсутствующие в составе пропускаются без отказа ·
        `applied: { id, removed }` — фактически убранные идентификаторы · отказы — как
        у `addReleaseIssues`.

        **`removeRelease`** (3.51.0) — удалить один релиз из активного реестра · роль:
        релиз-менеджер · тело `{ id, baseRev }`. Остальные записи реестра и задачи YouTrack
        из состава релиза не меняются. Архив не затрагивается: релиз, уже вынесенный
        в архив, операцией не удаляется (`release_not_found`). Удаление необратимо —
        восстановить запись можно только заново через `upsertRelease` · `applied: { id }` ·
        отказы: `ops_field_required:id`, `release_not_found`; у релиз-инженера —
        `release_engineer_scope_record_count_change`.

        **без `action` — полная замена реестра.**

        > ⚠ **Ограниченная операция.** Тело `{ releases, baseRev }` заменяет активный
        > реестр релизов проекта целиком: записи, которых нет в теле, удаляются без
        > возможности восстановления; `{"releases": []}` со свежим `baseRev` стирает все
        > активные релизы проекта. Архив при этом не меняется, но и вернуть запись из
        > архива в реестр нельзя. Роль — релиз-менеджер; релиз-инженеру полная замена
        > доступна лишь в пределах одного шага статуса. Внешним клиентам пользоваться
        > мелкими операциями.

        Так пишет реестр интерфейс планера. Отказы: `invalid_releases_structure`
        (`releases` не массив; запись с ключом вне схемы `Release`, с неверным типом либо
        длиной значения; повтор `id`; больше 500 записей), `base_rev_required`,
        `rev_conflict`, `releases_too_large`, у релиз-инженера — пять кодов правила
        релиз-инженера (перечислены выше).
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
        - name: action
          in: query
          required: false
          schema: { type: string, enum: [upsertRelease, setReleaseStatus, addReleaseIssues, removeReleaseIssues, removeRelease] }
          description: |
            Мелкая операция (3.49.0; `removeRelease` — 3.51.0). Параметр не передан — полная замена реестра
            (⚠ ограниченная). Иное непустое значение → `invalid_action`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/ReleasesRequest"
                - $ref: "#/components/schemas/UpsertReleaseRequest"
                - $ref: "#/components/schemas/SetReleaseStatusRequest"
                - $ref: "#/components/schemas/ReleaseIssuesRequest"
                - $ref: "#/components/schemas/RemoveReleaseRequest"
            examples:
              upsertRelease:
                summary: "?action=upsertRelease — создать релиз"
                value:
                  baseRev: 7
                  release:
                    id: "rel-2026-10"
                    name: "Релиз октябрь 2026"
                    kind: release
                    source: internal
                    status: planned
                    plannedDate: 1792022400000
                    freezeDate: 1791763200000
                    roleReps: { manager: petrova, engineer: ivanov }
                    issues: ["DEMO-101"]
              setReleaseStatus:
                summary: "?action=setReleaseStatus — перевести релиз на следующий шаг"
                value:
                  baseRev: 8
                  id: "rel-2026-10"
                  status: prep
              addReleaseIssues:
                summary: "?action=addReleaseIssues — добавить задачи в состав"
                value:
                  baseRev: 9
                  id: "rel-2026-10"
                  issues: ["DEMO-102", "DEMO-103"]
              removeReleaseIssues:
                summary: "?action=removeReleaseIssues — убрать задачу из состава"
                value:
                  baseRev: 10
                  id: "rel-2026-10"
                  issues: ["DEMO-103"]
              removeRelease:
                summary: "?action=removeRelease — удалить релиз (3.51.0)"
                value:
                  baseRev: 11
                  id: "rel-2026-10"
      responses:
        "200":
          description: |
            Результат записи — успех полной замены (`PostReleasesOk`), успех мелкой операции
            (`OpsOk`: те же ключи плюс `action` и `applied`), конфликт ревизий либо
            прикладная ошибка; HTTP-статус во всех случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PostReleasesOk"
                  - $ref: "#/components/schemas/OpsOk"
                  - $ref: "#/components/schemas/RevConflict"
                  - $ref: "#/components/schemas/AppError"

  /releases-archive:
    get:
      operationId: getReleasesArchive
      tags: ["Релизы"]
      summary: Архив закрытых релизов проекта — только чтение
      description: |
        Возвращает закрытые релизы (`released`, `cancelled`), которые авто-архив вынес из
        активного реестра при его росте (см. `POST /releases`). Записи той же формы, что
        в `GET /releases`, включая слепок закрытия `snapshot`; объём ответа — до 400 КБ.
        Архив только пополняется: операции записи, правки и удаления архива нет, ревизии
        у архива нет. Релизы, закрытые недавно, могут ещё оставаться в активном реестре —
        для полной истории читать оба пути.

        **Роль** — участник проекта; переключатель модуля релизов на ответ не влияет.
        Ничего не меняет. Отказы: `auth_required`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Архив релизов либо прикладная ошибка (`success:false`) — HTTP-статус в обоих
            случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ReleasesArchiveOk"
                  - $ref: "#/components/schemas/AppError"

  /reminders:
    get:
      operationId: getReminders
      tags: [Напоминания]
      summary: Активные напоминания проекта для текущего пользователя (3.40.0) — чистое чтение
      description: |
        Чтение без побочных эффектов (3.41.0: YouTrack исполняет GET в read-only транзакции,
        поэтому сверка журнала живёт в `POST /reminders {action:'sync'}` — интерфейс планера при загрузке
        зовёт его; ответ у обоих одинаковый). Сервер считает пункты трёх модулей (спринты —
        незавершённые роли и слот без согласования после `dateEnd`; ёмкость — не утверждена
        в горизонте N дней до старта и до конца спринта; релизы — плановая дата наступила,
        статус не терминальный), применяет права адресатов (валидаторы / кто утверждает
        ёмкость / представители релиза) и отдаёт только пункты, адресованные вызывающему.
        При выключенном мастере `remindersEnabled` — `enabled:false`. Права: факт
        аутентификации + доступ к проекту.
        «Сегодня» (`today`) — UTC-полночь текущих суток сервера; `days` пункта считается
        от календарной даты сущности (ближайшая UTC-полночь): `< 0` — через N дней,
        `0` — сегодня, `> 0` — N дней назад.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Список напоминаний, либо прикладная ошибка (`success:false`) —
            HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RemindersOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: syncReminders
      tags: [Напоминания]
      summary: Напоминания + сверка журнала (3.41.0) — запрос интерфейса планера при загрузке
      description: |
        Тот же ответ, что у `GET /reminders`, плюс побочный эффект — идемпотентная сверка журнала
        напоминаний проекта (повтор запроса даёт тот же журнал). Единственное действие — `sync`;
        иное → `invalid_action`. При выключенном мастере `remindersEnabled` — `enabled:false`,
        журнал не читается и не пишется. Права: факт аутентификации + доступ к проекту.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRemindersRequest"
      responses:
        "200":
          description: Список напоминаний либо прикладная ошибка (`success:false`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RemindersOk"
                  - $ref: "#/components/schemas/AppError"

  /reminders-journal:
    get:
      operationId: getRemindersJournal
      tags: [Напоминания]
      summary: Журнал напоминаний проекта (3.41.0)
      description: |
        Весь журнал проекта (кольцо 50 записей): когда пункт появился и чем погас. Порядок —
        день срабатывания по убыванию, при равном дне открытые записи впереди. Отдаётся и при
        выключенном мастере `remindersEnabled` — данные сохраняются. Ничего не пишет.
        Права: факт аутентификации + доступ к проекту.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: Журнал либо прикладная ошибка (`success:false`) — HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RemindersJournalOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: deleteRemindersJournalRecord
      tags: [Напоминания]
      summary: Удалить запись журнала напоминаний (3.41.0)
      description: |
        Единственное действие — `delete` по `id` записи. Удалить может только адресат записи:
        спринты — валидатор проекта; ёмкость — группа управления настройками или планировочные
        менеджеры; релизы — валидатор либо менеджер/инженер этого релиза (релиз ищется в активном
        сторе и архиве; релиза нет нигде — только валидатор). Удаление активной записи само
        напоминание не гасит: следующий `POST reminders sync` заведёт запись заново с сегодняшним днём.
        Отказы: `invalid_journal_action`, `invalid_journal_id`, `journal_record_not_found`
        (Bad Request), `not_addressee` (Forbidden).
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRemindersJournalRequest"
      responses:
        "200":
          description: Журнал после удаления либо прикладная ошибка (`success:false`).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RemindersJournalOk"
                  - $ref: "#/components/schemas/AppError"

  /sprint-lock:
    get:
      operationId: getSprintLock
      tags: ["Блокировка спринтов"]
      summary: Состояние блокировки создания спринтов и право вызывающего её переключать
      description: |
        Возвращает признак «создание новых спринтов в проекте заблокировано» (`locked`) и
        право вызывающего переключать блокировку (`canToggle`). Клиенту, который создаёт
        спринты, стоит читать этот путь перед записью нового спринта: при `locked: true`
        запись `POST /sprint-data` со спринтом, которого нет ни в рабочем слоте, ни
        в истории, ответит `sprint_creation_locked`. Правки уже существующих спринтов
        блокировка не затрагивает.

        **Роль** — участник проекта. Ревизии нет. Ничего не меняет. Отказы: `auth_required`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      responses:
        "200":
          description: |
            Состояние блокировки либо прикладная ошибка (`success:false`) — HTTP-статус
            в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SprintLockOk"
                  - $ref: "#/components/schemas/AppError"
    post:
      operationId: postSprintLock
      tags: ["Блокировка спринтов"]
      summary: "⚠ Ограниченная: включить либо снять блокировку создания спринтов"
      x-restricted: true
      description: |
        > ⚠ **Ограниченная операция.** Включённая блокировка запрещает создание новых
        > спринтов всем — и пользователям интерфейса планера, и интеграциям: запись нового
        > спринта отвечает `sprint_creation_locked`, пока блокировку не снимут. Операция
        > читает настройки проекта, меняет в них один признак и сохраняет настройки целиком
        > заново — без ревизии и без проверки формы настроек: совпавшее по времени
        > сохранение формы настроек может потерять одну из двух записей, а у проекта без
        > сохранённых настроек появятся настройки из одного этого признака. Роль — участник
        > групп блокировки спринтов, заданных в настройках проекта (раздел управления
        > правами), либо администратор YouTrack.

        Тело `{ "locked": true | false }`; повтор с тем же значением безвреден. Ревизии нет —
        `baseRev` не нужен. Это единственный путь записи признака: обычное сохранение
        настроек проекта хранимое значение не меняет. Роль управления настройками сама по
        себе права на переключение не даёт; в проекте, где группы блокировки не заданы либо
        группы ролей планера не настроены, ответ — `sprint_lock_rights_required`.

        Отказы: `auth_required`, `sprint_lock_rights_required`, `invalid_sprint_lock_body`
        (нет ключа `locked` либо значение не логическое), `settings_data_too_large`
        (настройки проекта с новым признаком превысили 500 КБ). Связанный отказ у записи
        спринта — `sprint_creation_locked`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprintLockRequest"
            example:
              locked: true
      responses:
        "200":
          description: |
            Новое состояние блокировки либо прикладная ошибка (`success:false`) —
            HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/SprintLockOk"
                  - $ref: "#/components/schemas/AppError"

  /planner-disabled:
    post:
      operationId: postPlannerDisabled
      tags: ["Администрирование"]
      summary: "⚠ Ограниченная: отключить либо включить планер в проекте"
      x-restricted: true
      description: |
        > ⚠ **Ограниченная операция.** Отключает либо включает планер в проекте целиком.
        > После отключения все остальные операции по адресу с ключом проекта
        > (`?projectKey=`) отвечают `planner_disabled`, а проект пропадает из выбора
        > проектов в общем режиме интерфейса планера — для пользователей и интеграций
        > проект выглядит выключенным. Данные планера при этом не удаляются и не меняются.
        > Роль — управление настройками.

        **Что закрывается, а что нет.** Отключение закрывает только адрес по ключу проекта.
        Сама операция `planner-disabled` из запрета исключена — включить планер обратно
        можно тем же адресом по ключу. Адрес по внутреннему id проекта признаком
        не закрывается вовсе: через него все операции контракта, включая записи,
        продолжают работать и в отключённом проекте — клиент, работающий по этому адресу,
        должен сам учитывать признак. Отдельного чтения состояния нет: признак
        `plannerDisabled` входит в `settings` ответа `GET /sprint-data`, а по адресу
        с ключом проекта отключение видно по самому отказу `planner_disabled`.

        Тело `{ "disabled": true | false }`; повтор с тем же значением безвреден. Ревизии
        нет — `baseRev` не нужен. Как и блокировка спринтов, операция сохраняет настройки
        проекта целиком заново с одним изменённым признаком (включение признак удаляет),
        без ревизии: совпавшее по времени сохранение формы настроек может потерять одну
        из двух записей. Это единственный путь записи признака — обычное сохранение
        настроек хранимое значение не меняет.

        Отказы: `auth_required`, `plugin_not_configured` (в проекте не задана группа
        управления настройками), `settings_manager_rights_required`,
        `invalid_planner_disable_body` (нет ключа `disabled` либо значение не логическое),
        `settings_data_too_large`. Связанный отказ остальных операций — `planner_disabled`.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerDisabledRequest"
            example:
              disabled: true
      responses:
        "200":
          description: |
            Новое состояние признака либо прикладная ошибка (`success:false`) —
            HTTP-статус в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PlannerDisabledOk"
                  - $ref: "#/components/schemas/AppError"

  /update-issue-field:
    post:
      operationId: postUpdateIssueField
      tags: ["Администрирование"]
      summary: "⚠ Ограниченная: записать значение поля в задачу YouTrack"
      x-restricted: true
      description: |
        > ⚠ **Ограниченная операция.** Единственная операция контракта, которая пишет
        > не в данные планера, а в сами задачи YouTrack: статус, приоритет, исполнитель,
        > трудозатраты и другие поля, назначенные планеру. Изменение сразу видно всем
        > пользователям YouTrack, запускает рабочие процессы проекта и через этот контракт
        > не откатывается. Роль — распределяющий, редактор, управление настройками,
        > релиз-менеджер либо релиз-инженер.

        Штатный REST YouTrack делает то же самое без плагина. Операция описана ради
        потолка прав сервисного токена: токен, допущенный к одной из этих ролей планера,
        может менять поля задач проекта — но не шире, чем описано ниже.

        **Потолок прав.**
        - Роль — любая из перечисленных выше; одной роли согласующего недостаточно
          (`assigner_rights_required`; группа управления настройками в проекте не задана —
          `plugin_not_configured`).
        - Только поля, назначенные планеру в настройках проекта: оценки и фактические
          трудозатраты по ролям, исполнители по ролям, приоритеты, статус, система, спринт
          (общий и по ролям), версия, тип, внешний номер обращения; поле статуса — заданное
          в настройках либо `State`. Иное поле — `field_not_whitelisted`.
        - Только задачи этого проекта (`issue_not_in_project`), которые пользователь токена
          видит: невидимая задача отвечает так же, как несуществующая, — `issue_not_found`.
        - Только поля, которые пользователь токена вправе менять сам по правам YouTrack, —
          иначе `field_not_writable`.

        **Значение по типу поля (`type`, по умолчанию `enum`).**
        - `enum`, `state`, `version`, `owned`, `build` — `value` — имя значения из набора
          поля; `null` — очистить поле. Поля нет в проекте — `field_not_found`, значения
          нет в наборе либо ключ `value` не передан — `value_not_found`.
        - `user` — `value` — логин; `null` — снять пользователя. Поля нет —
          `field_not_found`; логин не найден либо ключ `value` не передан — `user_not_found`.
        - `period` — `value` — минуты, целое от 0 до 100000; вне диапазона —
          `invalid_period_value`. Нечисловое значение и `null` записываются как 0.

        **Форма тела** проверяется раньше остального: `invalid_update_issue_params` (нет
        `issueId` либо `fieldName`, не строка, превышена длина, неизвестный `type`),
        `invalid_issue_id` (не вид `DEMO-101`), `invalid_field_name` (управляющие символы,
        `<`, `>`, `"`). Исключение YouTrack при записи (например, отказ рабочего процесса) —
        `update_issue_field_failed` класса `internal_error`; ключ `message` несёт текст
        исключения до 300 символов — диагностика, не разбирать. Без аутентификации —
        `auth_required`.

        **Особенность конверта.** У шести кодов — `issue_not_found`,
        `issue_not_in_project`, `field_not_writable`, `field_not_found`, `user_not_found`,
        `value_not_found` — код стоит в самом `error` (так его читает интерфейс планера),
        `reason` его дублирует; `cid` присутствует, как у любого отказа. Клиенту сравнивать
        по `reason`.

        Ревизии нет. Данные планера операция не меняет: копии полей задачи в составе
        спринта (статус, приоритет и другие) сами не обновятся.
      parameters:
        - $ref: "#/components/parameters/ProjectKeyGlobal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueFieldRequest"
            examples:
              assignee:
                summary: Назначить исполнителя роли
                value:
                  issueId: "DEMO-101"
                  fieldName: "Аналитик"
                  type: user
                  value: ivanov
              state:
                summary: Сменить статус задачи
                value:
                  issueId: "DEMO-101"
                  fieldName: "State"
                  type: state
                  value: "В работе"
              period:
                summary: Записать трудозатраты — 8 часов в минутах
                value:
                  issueId: "DEMO-101"
                  fieldName: "Оценка аналитики"
                  type: period
                  value: 480
      responses:
        "200":
          description: |
            Подтверждение записи либо прикладная ошибка (`success:false`) — HTTP-статус
            в обоих случаях 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/UpdateIssueFieldOk"
                  - $ref: "#/components/schemas/AppError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Permanent-токен YouTrack: Authorization: Bearer perm-..."

  parameters:
    ProjectKeyGlobal:
      name: projectKey
      in: query
      required: false
      schema: { type: string }
      description: |
        Ключ проекта (например `DEMO`) — обязателен по основному адресу (по ключу проекта);
        по альтернативному адресу (по внутреннему id) не используется.

  schemas:
    RoleKey:
      type: string
      description: Ключ роли планирования (фиксированный набор плагина)
      enum: [analysis, testing, devPlatform, devBack, devFront, devIos, devAndroid, devFs, devDb]

    PhaseInterval:
      type: [object, "null"]
      description: Интервал фазы работ (3.45.0) — `null` = фаза не планируется
      required: [dateStart, dateEnd]
      additionalProperties: false
      properties:
        dateStart:
          type: number
          description: Начало фазы, epoch ms (календарная дата — UTC-полночь)
        dateEnd:
          type: number
          description: Конец фазы, epoch ms; по дням не раньше dateStart

    Sprint:
      type: object
      description: |
        Шапка спринта. Валидатор допускает null почти в каждом поле, но для
        работоспособного черновика практически обязательны: `sprintId`, `name`,
        `status`, `dateStart`, `dateEnd`.
        Динамические ключи `resource<Роль>` (например `resourceAnalysis`,
        `resourceDevPlatform`) — доступный ресурс роли в минутах;
        ключи семейства `remain*` — служебные остатки, внешней системе их
        отправлять не нужно.
      properties:
        sprintId:
          type: [string, "null"]
          maxLength: 100
          description: Стабильный идентификатор спринта (ключ дедупликации в истории)
        name:
          type: [string, "null"]
          maxLength: 500
        status:
          type: [string, "null"]
          enum: [PLANNING, PLANNED, CONFIRMED, ALLOCATED, FINISHED, null]
          description: Для рыбы всегда PLANNING («Черновик»)
        dateStart:
          type: [number, "null"]
          description: Начало спринта, epoch ms
        dateEnd:
          type: [number, "null"]
          description: Конец спринта, epoch ms
        sprintGoal:
          type: [string, "null"]
          maxLength: 500
        sprintFieldVal:
          type: [string, "null"]
          maxLength: 500
          description: Значение поля «Спринт» YouTrack, к которому привязан спринт
        sprintFieldValByRole:
          type: [object, "null"]
          description: |
            Значение спринта по ролям (3.35.0): `{ "<roleKey>": "<значение>" }`, ≤ 50 записей,
            значения — строки ≤ 500. Заполняется только когда у ролей разные поля «Спринт»;
            отсутствие ключа = прежнее поведение (общее `sprintFieldVal` для всех ролей).
          additionalProperties: { type: string, maxLength: 500 }
        phases:
          type: [object, "null"]
          description: |
            Фазы работ спринта (3.45.0, #120): шесть необязательных ключей
            `analysis` · `development` · `techTest` · `regression` · `bizTest` · `deploy`,
            каждый — `null` («не планируется») или `{ dateStart, dateEnd }` (epoch ms,
            календарные даты — UTC-полночь, `dateEnd ≥ dateStart` по дням). Иные ключи —
            отказ `invalid_phases_structure:*`. Записываются ТОЛЬКО через
            `POST /sprint-data?action=phases`; в теле обычного `POST /sprint-data` ключи
            `phases`/`phasesUpdatedAt`/`phasesUpdatedBy` переопределяются хранимыми, если у
            спринта уже есть носитель (рабочий слот или снимок истории); у спринта, впервые
            появляющегося в инстансе, они принимаются как есть.
          additionalProperties: false
          properties:
            analysis:    { $ref: "#/components/schemas/PhaseInterval" }
            development: { $ref: "#/components/schemas/PhaseInterval" }
            techTest:    { $ref: "#/components/schemas/PhaseInterval" }
            regression:  { $ref: "#/components/schemas/PhaseInterval" }
            bizTest:     { $ref: "#/components/schemas/PhaseInterval" }
            deploy:      { $ref: "#/components/schemas/PhaseInterval" }
        phasesUpdatedAt:
          type: [number, "null"]
          description: Мгновение последней правки фаз (epoch ms); штампует сервер
        phasesUpdatedBy:
          type: [string, "null"]
          maxLength: 200
          description: Штампует сервер — отображаемое имя автора последней правки фаз; клиентское значение игнорируется
        roles:
          type: [array, "null"]
          description: |
            Роли-участницы спринта (3.27.0): подмножество RoleKey, фиксируется при создании
            и далее не меняется. Отсутствие ключа = все активные роли проекта.
          items: { $ref: "#/components/schemas/RoleKey" }
          maxItems: 9
        versionFieldVal:
          type: [string, "null"]
          maxLength: 500
          description: Значение поля версии/релиза (если используется проектом)
        updatedBy:
          type: [string, "null"]
          maxLength: 200
          readOnly: true
          description: |
            Логин автора последнего изменения. Ставит сервер по учётной записи вызывающего
            (3.18.0); значение из тела запроса игнорируется — присылать не нужно.
        updatedAt:
          type: [number, "null"]
          readOnly: true
          description: Момент последнего изменения, epoch ms. Ставит сервер — по тому же правилу, что `updatedBy`
        pluginVersion:
          type: [string, "null"]
          maxLength: 32
          readOnly: true
          description: |
            Маркер схемы данных, которым сервер штампует запись при каждой записи
            (значение внутреннее, не совпадает с версией приложения).
            Клиентское значение игнорируется — не отправлять.
        personalPlanning:
          type: [object, "null"]
          description: Персональное планирование исполнителей — служебный контур интерфейса планера, агенту не заполнять
        migrationLog:
          type: [array, "null"]
          description: Служебный аудит схемных миграций — не отправлять
        _rev:
          type: number
          readOnly: true
          description: Ревизия слота. Штампуется сервером при записи; клиентское значение игнорируется. Из GET используется как baseRev следующего POST
      patternProperties:
        "^(resource|remain)[A-Za-z0-9_]*$":
          type: [number, "null"]
          minimum: 0
          maximum: 100000000
          description: Минуты
      additionalProperties: false

    Item:
      type: object
      description: |
        Задача в составе роли. Практически обязательны `issueId`, `title`, `url`.
        Динамические числовые ключи: `estimate_<roleKey>` (оценка),
        `fact_<roleKey>` (факт), `alloc_<roleKey>` (аллокация) — минуты;
        семейства `allocation*`, `estH_*`, `factH_*` — служебные.
      properties:
        issueId:
          type: [string, "null"]
          maxLength: 100
          description: Читаемый id задачи YouTrack (DEMO-101)
        url:
          type: [string, "null"]
          maxLength: 2000
          description: Ссылка на задачу; только http(s):// (пустая строка допустима)
        title:
          type: [string, "null"]
          maxLength: 1000
        priority:
          type: [string, "null"]
          maxLength: 1000
        xpriority:
          type: [string, "null"]
          maxLength: 1000
          description: Вторичный приоритет (если настроен проектом)
        state:
          type: [string, "null"]
          maxLength: 1000
          description: Состояние задачи на момент включения
        system:
          type: [string, "null"]
          maxLength: 1000
          description: Значение поля «Система» (если настроено проектом)
        version:
          type: [string, "null"]
          maxLength: 1000
        inclusionStatus:
          type: [string, "null"]
          enum: [INC_PENDING, INC_PLANNED, INC_UNPLANNED, INC_EXCLUDED, null]
          description: Статус включения в спринт; для рыбы обычно INC_PLANNED
        assignee:
          type: [string, "null"]
          maxLength: 1000
          description: Логин исполнителя (заполняется синхронизацией интерфейса планера — агенту можно опустить)
        addedBy:
          type: [string, "null"]
          maxLength: 1000
        addedAt:
          type: [number, "null"]
          description: epoch ms
        excludeReason:
          type: [string, "null"]
          maxLength: 500
          description: |
            Причина исключения (3.46.0). Обязательна при переводе элемента в `INC_EXCLUDED`
            на записи состава (`reason_required`), потолок 500 символов после trim
            (`reason_too_long`); уже исключённая без причины принимается как есть;
            при других статусах сервер срезает ключ
        excludedAt:
          type: [number, "null"]
          description: Момент исключения, epoch ms (3.46.0) — ставит сервер, присланное игнорируется
        excludedBy:
          type: [string, "null"]
          maxLength: 1000
          description: Кто исключил (3.46.0) — ставит сервер, присланное игнорируется
        externalTicketId:
          type: [string, "null"]
          maxLength: 1000
          description: Внешний тикет (id или URL), если проектом настроено соответствующее поле
        stateLocalized:
          type: [string, "null"]
          maxLength: 1000
          description: Служебное (Гант) — заполняет интерфейс планера
        stateFieldId:
          type: [string, "null"]
          maxLength: 1000
          description: Служебное (Гант) — заполняет интерфейс планера
        stateColor:
          type: [object, "null"]
          description: Служебное (Гант) — заполняет интерфейс планера
          properties:
            background:
              type: [string, "null"]
              maxLength: 100
            foreground:
              type: [string, "null"]
              maxLength: 100
      patternProperties:
        "^(estimate_|fact_|alloc_|allocation|estH_|factH_)":
          type: [number, "null"]
          description: Минуты
      additionalProperties: false

    RoleItems:
      type: object
      description: |
        Состав спринта по ролям: `{ "<roleKey>": [Item, ...] }`.
        Допустимы только 9 ключей из RoleKey; заполнять следует только роли,
        перечисленные в `settings.activeRoles` ответа GET. ≤ 1000 задач на роль.
      properties:
        analysis:    { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        testing:     { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        devPlatform: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        devBack:     { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        devFront:    { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        devIos:      { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        devAndroid:  { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        devFs:       { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
        devDb:       { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/Item" } }
      additionalProperties: false

    GetSprintDataOk:
      type: object
      properties:
        success:
          const: true
        sprint:
          oneOf:
            - $ref: "#/components/schemas/Sprint"
            - type: "null"
          description: null — рабочий слот пуст (baseRev следующей записи = 0)
        roleItems:
          $ref: "#/components/schemas/RoleItems"
        settings:
          type: [object, "null"]
          description: |
            Полные настройки проекта (большой объект; контракт вне этой спеки).
            Для агента значимо поле `activeRoles: RoleKey[]` — какие роли
            реально планируются в проекте. Ответ включает и административные
            ключи (группы по ролям, ставки/коэффициенты) — принятая модель
            доверия, см. раздел «Авторизация и права».
        orphanGanttIssues:
          description: Служебная диагностика интерфейса планера — игнорировать
        enableDebugLog:
          type: boolean
        configured:
          type: boolean
          description: |
            false — в app-настройках проекта не задана группа управления
            настройками; чтение работает, любая запись вернёт plugin_not_configured
      required: [success, sprint, roleItems]

    PostSprintDataRequest:
      type: object
      description: Ключи верхнего уровня строго из этого списка (whitelist)
      properties:
        sprint:
          oneOf:
            - $ref: "#/components/schemas/Sprint"
            - type: "null"
          description: null — явный сброс слота (агенту не использовать)
        roleItems:
          $ref: "#/components/schemas/RoleItems"
        baseRev:
          type: number
          description: |
            `sprint._rev` из предшествующего GET (слот пуст → 0). Расхождение
            с текущей ревизией слота → ответ rev_conflict, ничего не записано.
            С 3.38.0 сервер отвергает тело с `sprint`/`roleItems` без числового
            baseRev (отсутствует, null, строка) ответом Bad Request
            `base_rev_required` — ничего не записано. До 3.38.0 такое тело
            писалось без блокировки (last-write-wins). Тела только с `settings`
            под ревизию не подпадают.
      required: [sprint, roleItems, baseRev]
      additionalProperties: false

    PostSprintDataOk:
      type: object
      properties:
        success:
          const: true
        saved:
          type: array
          items:
            type: string
            enum: [sprint, roleItems, settings]
          description: Какие блоки фактически записаны (для этого контракта — sprint и roleItems)
        rev:
          type: number
          description: Новая ревизия слота после записи
        warnings:
          type: array
          items: { type: string }
          description: Предупреждения согласования (`?action=validate`), например `overlimit:<роль>`; при обычной записи отсутствует
        enriched:
          type: object
          description: |
            Итог серверного обогащения состава (v3.18.0). Присутствует, только если
            обогащение затронуло хотя бы одну задачу: count — обогащено, skipped —
            не обогащено из-за лимита 200/запрос (дослать отдельной записью).
            Недоступные/несуществующие задачи в счётчики не входят.
          properties:
            count: { type: number }
            skipped: { type: number }
          required: [count, skipped]
      required: [success]

    RevConflict:
      type: object
      description: Слот изменён другим писателем после вашего GET. Ничего не записано — перечитать GET и повторить
      properties:
        success:
          const: false
        error:
          const: rev_conflict
        reason:
          const: rev_conflict
          description: Дублирует `error` (3.49.0) — единый признак отказа для клиента, который ветвится по `reason`
        rev:
          type: number
          description: Текущая ревизия слота на сервере
        cid:
          type: string
          description: Идентификатор запроса (3.37.0) — назвать в баг-репорте, по нему находится строка в логе сервера
      required: [success, error, rev]

    AppError:
      type: object
      description: Прикладная ошибка (приходит с HTTP 200 — см. описание API)
      properties:
        success:
          const: false
        error:
          type: string
          description: |
            Класс отказа. У отказов записи полей задач (`POST /update-issue-field`) здесь стоит
            сам код причины — так его читает интерфейс планера; `reason` его дублирует (3.49.0).
          enum: ["Bad Request", "Forbidden", "internal_error", "rev_conflict", "issue_not_found", "issue_not_in_project", "field_not_writable", "field_not_found", "user_not_found", "value_not_found"]
        cid:
          type: string
          description: Идентификатор запроса (3.37.0) — назвать в баг-репорте, по нему находится строка в логе сервера
        reason:
          type: string
          description: |
            Машинный код причины, присутствует в каждом отказе. Пояснения «что значит» и
            «что делать» по каждому коду — Integrations/ERROR_CODES.md (страница документации
            «Ответы и коды отказов»); перечень сверяется с кодом плагина гейтом.
            Код с завершающим двоеточием — префикс: сервер дописывает уточнение,
            сравнивать по началу строки.
            Класс Forbidden — assigner_rights_required, auth_required, editor_rights_required,
            history_manager_rights_required, not_addressee, planner_disabled,
            plugin_not_configured, project_unavailable, release_engineer_scope_field_change,
            release_engineer_scope_record_added, release_engineer_scope_record_count_change,
            release_engineer_scope_snapshot_change, release_engineer_scope_status_transition,
            release_rights_required, settings_manager_rights_required, sprint_creation_locked,
            sprint_lock_rights_required, validator_rights_required.
            Класс Bad Request — absence_not_found, absences_data_too_large, absences_invalid,
            alloc_sum_exceeds_100, auth_required, base_rev_required, calendar_data_too_large,
            calendar_invalid, capacity_data_too_large, capacity_persons_required,
            field_not_whitelisted, history_data_too_large, invalid_action,
            invalid_capacity_structure, invalid_field_name, invalid_history_structure,
            invalid_history_structure:, invalid_issue_id, invalid_journal_action,
            invalid_journal_id, invalid_json, invalid_period_value, invalid_personal_planning,
            invalid_phases_body, invalid_phases_structure:, invalid_planner_disable_body,
            invalid_project_key, invalid_releases_structure, invalid_reminders_structure,
            invalid_role_items_structure, invalid_settings_structure, invalid_snapshot_body,
            invalid_sprint_lock_body, invalid_sprint_structure, invalid_update_issue_params,
            item_not_found, journal_record_not_found, mixed_settings_write, ops_field_invalid:,
            ops_field_required:, phases_disabled, phases_out_of_sprint:,
            prototype_pollution_detected, reason_required, reason_too_long, release_not_found,
            releases_too_large, role_items_data_too_large, role_record_not_found,
            settings_data_too_large, sprint_data_too_large, sprint_dates_missing,
            sprint_finished, sprint_id_required, sprint_not_current, sprint_not_found,
            sprint_required, too_large.
            Класс internal_error — internal_error, reminders_journal_write_failed,
            update_issue_field_failed.
            Класс rev_conflict — rev_conflict.
            Отказы полей задач (код стоит в самом error, reason его дублирует) —
            field_not_found, field_not_writable, issue_not_found, issue_not_in_project,
            user_not_found, value_not_found.
            Вложенные errors[].code (внутри calendar_invalid и absences_invalid) —
            delta_must_be_zero, duplicate_date, from_after_to, invalid_date, invalid_delta,
            invalid_login, invalid_type, invalid_year, not_array, not_object, year_mismatch.
        errors:
          type: array
          description: Вложенные коды — только у `calendar_invalid`, `absences_invalid` и `phases_out_of_sprint:`; каждая запись называет место ошибки и `code`
          items: { type: object }
        rev:
          type: number
          description: Текущая ревизия — только у `rev_conflict`
        message:
          type: string
          description: Диагностика — только у `update_issue_field_failed`; не разбирать
      required: [success, error, reason, cid]

    OpsOk:
      type: object
      description: |
        Ответ мелкой операции (3.49.0): конверт полной записи того же пути плюс `action` и
        `applied`. Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        action:
          type: string
          description: Имя выполненной мелкой операции
        applied:
          type: object
          description: Что именно изменено — состав ключей зависит от операции и назван в её описании
        rev:
          type: number
          description: Новая ревизия данных — у путей с ревизией (спринт, релизы, отсутствия)
        historyRev:
          type: number
          description: Новая ревизия истории — только у `assignPerson`
      required: [success, action, applied]

    RemindersOk:
      type: object
      description: Активные напоминания, адресованные вызывающему (3.40.0)
      properties:
        success:
          const: true
        enabled:
          type: boolean
          description: Мастер напоминаний проекта включён; при false остальные поля пусты
        today:
          type: number
          description: «Сегодня» сервера — UTC-полночь текущих суток (epoch-ms); отсутствует при enabled:false
        count:
          type: number
          description: Число пунктов в items
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReminderItem"
        modules:
          $ref: "#/components/schemas/ReminderModules"
      required: [success, enabled, count, items, modules]

    ReminderItem:
      type: object
      description: Один пункт напоминания
      properties:
        id:
          type: string
          description: "`<module>:<entityId>` — стабилен в пределах дня"
        module:
          type: string
          enum: [sprints, capacity, releases]
        kind:
          type: string
          description: Ключ текста напоминания
          enum: [sprintRoleOpen, sprintSlotOver, capacityBefore, capacityAfter, releaseOverdue]
        entityId:
          type: string
          description: "Спринты: id записи истории `<sprintId>_<roleKey>` или id слота; ёмкость: id спринта; релизы: id релиза"
        params:
          type: object
          description: Подстановки текста — имена сущностей (sprint, role, release, status); строки или null
        days:
          type: number
          description: "Целое: < 0 — через N дней, 0 — сегодня, > 0 — N дней назад"
        ref:
          type: object
          description: Адрес перехода — sprintId + roleKey (спринты), sprintId (ёмкость), releaseId (релизы)
      required: [id, module, kind, entityId, params, days, ref]

    ReminderModules:
      type: object
      description: Состояние модулей для вызывающего — включён ли модуль (тумблер ∧ доступность) и адресат ли он
      properties:
        sprints:
          type: object
          description: "{ on: boolean, addressee: boolean }"
        capacity:
          type: object
          description: "{ on: boolean, addressee: boolean }"
        releases:
          type: object
          description: "{ on: boolean, addressee: boolean }"

    RemindersJournalOk:
      type: object
      description: Журнал напоминаний проекта (3.41.0)
      properties:
        success:
          const: true
        today:
          type: number
          description: «Сегодня» сервера — UTC-полночь текущих суток (epoch-ms)
        journal:
          type: array
          description: День срабатывания по убыванию, при равном дне открытые впереди; не более 50
          items:
            $ref: "#/components/schemas/ReminderJournalRecord"
      required: [success, today, journal]

    ReminderJournalRecord:
      type: object
      description: Одна запись журнала — «появился / погас» по ключу «модуль + сущность + день»
      properties:
        id:
          type: string
          description: "`<module>:<entityId>:<firedDay>` — детерминирован, по нему удаляют"
        module:
          type: string
          enum: [sprints, capacity, releases]
        kind:
          type: string
          enum: [sprintRoleOpen, sprintSlotOver, capacityBefore, capacityAfter, releaseOverdue]
        entityId:
          type: string
        params:
          type: object
          description: Слепок имён на момент срабатывания (sprint, role, release, status) — сущность могла исчезнуть
        firedDay:
          type: number
          description: UTC-полночь дня, когда сервер впервые увидел пункт активным (epoch-ms)
        resolvedDay:
          type: [number, "null"]
          description: День гашения; null — запись открыта
        resolvedHow:
          type: [string, "null"]
          enum: [roleFinished, validated, capacityApproved, sprintOver, released, cancelled, dateMoved, gone, moduleOff, null]
        resolvedBy:
          type: [string, "null"]
          description: Логин, чьё действие погасило пункт, если известен
      required: [id, module, kind, entityId, params, firedDay, resolvedDay, resolvedHow, resolvedBy]

    PostRemindersJournalRequest:
      type: object
      properties:
        action:
          type: string
          enum: [delete]
        id:
          type: string
          description: id записи из журнала
      required: [action, id]

    PostRemindersRequest:
      type: object
      properties:
        action:
          type: string
          enum: [sync]
      required: [action]

    SprintValidateRequest:
      title: validate
      description: |
        Тело `POST /sprint-data?action=validate` — то же, что у полной записи: `sprint`,
        `roleItems`, `baseRev`. Предупреждения о перелимите считаются, только когда
        присланы и `sprint`, и `roleItems`.
      allOf:
        - $ref: "#/components/schemas/PostSprintDataRequest"

    SprintAssignerSyncRequest:
      type: object
      title: assignerSync
      description: |
        Тело `POST /sprint-data?action=assignerSync` — замена персонального распределения
        в хранимом спринте слота. Ключ `roleItems`, если прислан, игнорируется.
      required: [sprint, baseRev]
      additionalProperties: false
      properties:
        sprint:
          type: object
          description: |
            Читается только `personalPlanning`; прочие ключи игнорируются — остальное
            берётся из хранимого спринта. Нет ключа `sprint`, он `null` либо не объект —
            отказ `sprint_required`.
          properties:
            personalPlanning:
              type: [object, "null"]
              description: |
                Копия персонального распределения по ролям: `{ "<roleKey>": { … } }`,
                значение роли — как `personalPlanning` в `HistoryRecord`. ⚠ Ключ не
                передан либо `null` — распределение обнуляется. Не объект и не `null` —
                `invalid_personal_planning`.
        baseRev:
          type: number
          description: "`sprint._rev` из `GET /sprint-data`; иначе `base_rev_required`, расхождение — `rev_conflict`"

    SprintAssignerSyncOk:
      type: object
      description: "Успех `POST /sprint-data?action=assignerSync`. Схема ответа: состав ключей может расширяться"
      required: [success, action]
      properties:
        success:
          const: true
        action:
          const: assignerSync
        rev:
          type: number
          description: Новая ревизия слота

    SprintPhases:
      type: object
      description: |
        Фазы работ спринта (3.45.0): шесть необязательных ключей, каждый — `null`
        («не планируется») либо интервал. Иной ключ — отказ `invalid_phases_structure:shape`,
        неверный интервал — `invalid_phases_structure:<фаза>`.
      additionalProperties: false
      properties:
        analysis:    { $ref: "#/components/schemas/PhaseInterval" }
        development: { $ref: "#/components/schemas/PhaseInterval" }
        techTest:    { $ref: "#/components/schemas/PhaseInterval" }
        regression:  { $ref: "#/components/schemas/PhaseInterval" }
        bizTest:     { $ref: "#/components/schemas/PhaseInterval" }
        deploy:      { $ref: "#/components/schemas/PhaseInterval" }

    SprintPhasesRequest:
      type: object
      title: phases
      description: Тело `POST /sprint-data?action=phases` — запись фаз работ спринта (3.45.0)
      required: [sprint, baseRev]
      additionalProperties: false
      properties:
        sprint:
          type: object
          description: Читаются только `sprintId` и `phases`; прочие ключи игнорируются. Нарушение формы — `invalid_phases_body`
          required: [sprintId, phases]
          properties:
            sprintId:
              type: string
              minLength: 1
              maxLength: 100
              description: Идентификатор спринта — в рабочем слоте либо в записях истории
            phases:
              $ref: "#/components/schemas/SprintPhases"
        baseRev:
          type: number
          description: |
            `sprint._rev` из `GET /sprint-data`. Обязателен числом всегда (`base_rev_required`),
            но сверяется с ревизией слота, только если слот держит этот спринт.

    SprintPhasesOk:
      type: object
      description: "Успех `POST /sprint-data?action=phases`. Схема ответа: состав ключей может расширяться"
      required: [success, action, sprintId, changed, phases, snaps]
      properties:
        success:
          const: true
        action:
          const: phases
        sprintId:
          type: string
        changed:
          type: boolean
          description: false — фазы совпали с сохранёнными, записи не было, ревизии не менялись
        phases:
          $ref: "#/components/schemas/SprintPhases"
          description: Итоговые фазы — все шесть ключей
        phasesUpdatedAt:
          type: [number, "null"]
          description: Момент последней правки фаз, epoch ms; ставит сервер
        phasesUpdatedBy:
          type: [string, "null"]
          description: Отображаемое имя автора последней правки; ставит сервер
        rev:
          type: number
          description: Ревизия слота — только если слот держит этот спринт
        historyRev:
          type: number
          description: Новая ревизия истории — только если фазы записаны в записи истории
        snaps:
          type: number
          description: Сколько записей истории получили фазы

    UpsertItemRequest:
      type: object
      title: upsertItem
      description: |
        Тело `POST /sprint-data?action=upsertItem` (3.49.0) — добавить задачу в состав роли
        либо обновить её слиянием ключей.
      required: [roleKey, item, baseRev]
      additionalProperties: false
      properties:
        roleKey:
          $ref: "#/components/schemas/RoleKey"
        item:
          description: |
            Задача по схеме `Item`; `issueId` обязателен. У существующей задачи присланные
            ключи заменяют хранимые, остальные сохраняются. Неизвестный ключ —
            `invalid_role_items_structure`.
          allOf:
            - $ref: "#/components/schemas/Item"
            - type: object
              required: [issueId]
              properties:
                issueId:
                  type: string
                  pattern: "^[A-Za-z][A-Za-z0-9_]*-\\d+$"
        baseRev:
          type: number
          description: "`sprint._rev` из `GET /sprint-data` (слот пуст → 0)"

    RemoveItemRequest:
      type: object
      title: removeItem
      description: Тело `POST /sprint-data?action=removeItem` (3.49.0) — убрать задачу из состава роли
      required: [roleKey, issueId, baseRev]
      additionalProperties: false
      properties:
        roleKey:
          $ref: "#/components/schemas/RoleKey"
        issueId:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]*-\\d+$"
          description: Читаемый id задачи (DEMO-101)
        baseRev:
          type: number
          description: "`sprint._rev` из `GET /sprint-data`"

    PatchSprintRequest:
      type: object
      title: patchSprint
      description: |
        Тело `POST /sprint-data?action=patchSprint` (3.49.0) — изменить часть ключей шапки
        спринта в слоте.
      required: [sprint, baseRev]
      additionalProperties: false
      properties:
        sprint:
          description: |
            Любая часть ключей схемы `Sprint`: `name`, `status`, `dateStart`, `dateEnd`,
            `sprintGoal`, `sprintFieldVal`, `sprintFieldValByRole`, `versionFieldVal`, `roles`,
            `resource<Роль>`. `sprintId` — только равный хранимому. Ключи `updatedBy`,
            `updatedAt`, `pluginVersion`, `_rev`, `migrationLog`, `personalPlanning` и `phases*`
            отбрасываются молча; неизвестный ключ — `invalid_sprint_structure`.
          allOf:
            - $ref: "#/components/schemas/Sprint"
        baseRev:
          type: number
          description: "`sprint._rev` из `GET /sprint-data`"

    AssignPersonRequest:
      type: object
      title: assignPerson
      description: |
        Тело `POST /sprint-data?action=assignPerson` (3.49.0) — назначение человека на
        задачу роли и даты его работы над ней.
      required: [roleKey, issueId, login, baseRev]
      additionalProperties: false
      properties:
        roleKey:
          $ref: "#/components/schemas/RoleKey"
        issueId:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]*-\\d+$"
          description: Читаемый id задачи (DEMO-101)
        login:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          description: Логин исполнителя (ivanov); `null` — снять человека с задачи. Ключ обязателен
        dateStart:
          type: [number, "null"]
          description: Начало работы над задачей, epoch ms; `null` — снять дату; ключ не передан — дата не меняется
        dateEnd:
          type: [number, "null"]
          description: Окончание работы над задачей, epoch ms; `null` — снять дату; ключ не передан — дата не меняется
        baseRev:
          type: number
          description: "`sprint._rev` из `GET /sprint-data`; сверяется первой из двух записей операции"

    AppVersionOk:
      type: object
      description: "Версия установленного плагина. Схема ответа: состав ключей может расширяться"
      required: [success, version]
      properties:
        success:
          const: true
          description: Присутствует с 3.49.0
        version:
          type: string
          description: Версия приложения вида `X.Y.Z`; совпадает с `info.version` контракта той же редакции

    FilterPlannerProjectsRequest:
      type: object
      description: |
        Тело `POST /filter-planner-projects` (3.51.0): ключи проектов для проверки.
        Посторонние ключи верхнего уровня сервер отбрасывает молча.
      properties:
        keys:
          type: array
          items:
            type: string
            maxLength: 100
          description: |
            Ключи проектов (`shortName`), например из `GET /api/admin/projects`. Не массив —
            `invalid_keys`; сверх 5000 ключей — отбрасываются.
      required: [keys]

    FilterPlannerProjectsOk:
      type: object
      description: "Ответ `POST /filter-planner-projects` (3.51.0). Схема ответа: состав ключей может расширяться"
      properties:
        success:
          const: true
        projects:
          type: array
          items:
            $ref: "#/components/schemas/PlannerProject"
          description: Проекты с подключённым планером, видимые вызывающему, по названию; нет таких — пустой массив
      required: [success, projects]

    PlannerProject:
      type: object
      description: Проект с подключённым планером — строка ответа `POST /filter-planner-projects`
      properties:
        key:
          type: string
          description: Ключ проекта в том написании, что пришло в запросе (без пробелов по краям)
        name:
          type: string
          description: Название проекта
        hasMirror:
          type: boolean
          description: |
            true — планер сохранил в проекте копию группы управления настройками для
            основного адреса; false — запись по основному адресу отвечает
            `plugin_not_configured`, пока планер не откроют в проекте
        disabled:
          type: boolean
          description: Есть только со значением true — планер в проекте отключён (виден тем, кто может включить)
      required: [key, name, hasMirror]

    MyRolesOk:
      type: object
      description: "Ответ `GET /my-roles` (3.51.0). Схема ответа: состав ключей может расширяться"
      properties:
        success:
          const: true
        configured:
          type: boolean
          description: Группа управления настройками задана в настройках приложения в проекте
        disabled:
          type: boolean
          description: Планер отключён в проекте (по основному адресу всегда false — см. описание операции)
        instanceAdmin:
          type: boolean
          description: Вызывающий — администратор YouTrack
        roles:
          $ref: "#/components/schemas/MyRoles"
      required: [success, configured, disabled, instanceAdmin, roles]

    MyRoles:
      type: object
      description: Роли вызывающего по группам планера; true — роль есть
      properties:
        editor:
          type: boolean
        assigner:
          type: boolean
        validator:
          type: boolean
        historyManager:
          type: boolean
        settingsManager:
          type: boolean
        planningManager:
          type: boolean
        releaseManager:
          type: boolean
        releaseEngineer:
          type: boolean
        sprintLockManager:
          type: boolean
      required: [editor, assigner, validator, historyManager, settingsManager, planningManager, releaseManager, releaseEngineer, sprintLockManager]

    HistoryRecord:
      type: object
      description: |
        Запись истории — снимок спринта по одной роли. Одна схема для ответа `GET /history`
        и для элемента массива `history` в записях `POST /history`. На записи неизвестный
        ключ — отказ `invalid_history_structure: <где>`; почти каждое поле допускает `null`.
        Схема ответа: состав ключей может расширяться. Динамические ключи `resource<Роль>`
        и `remain<Роль>` — ресурс и остаток роли в минутах.
        Ключи, которые ставит сервер, помечены в описаниях; при
        `POST /history?action=import-replace` сервер ставит только `pluginVersion`.
      properties:
        sprintId:
          type: [string, "null"]
          maxLength: 500
          description: "Идентификатор записи — составной: `<id спринта>_<roleKey>` (sprint-2026-10_analysis). По нему `snapshot` находит заменяемую запись"
        name:
          type: [string, "null"]
          maxLength: 500
          description: Название спринта
        status:
          type: [string, "null"]
          enum: [PLANNING, CONFIRMED, ALLOCATED, FINISHED, null]
          description: Статус роли в спринте
        roleKey:
          oneOf:
            - $ref: "#/components/schemas/RoleKey"
            - type: "null"
        roleLabel:
          type: [string, "null"]
          maxLength: 500
          description: Отображаемое название роли
        confirmedBy:
          type: [string, "null"]
          maxLength: 500
          description: Кто согласовал. Ставит сервер — изменившееся значение заменяется именем автора запроса
        confirmedAt:
          type: [number, "null"]
          description: Момент согласования, epoch ms
        dateStart:
          type: [number, "null"]
          description: Начало спринта, epoch ms
        dateEnd:
          type: [number, "null"]
          description: Конец спринта, epoch ms
        finishedBy:
          type: [string, "null"]
          maxLength: 500
          description: Кто завершил. Ставит сервер — как `confirmedBy`
        finishedAt:
          type: [number, "null"]
          description: Момент завершения, epoch ms
        isOverLimit:
          type: [boolean, "null"]
          description: Роль согласована с перелимитом
        sprintFieldVal:
          type: [string, "null"]
          maxLength: 500
          description: Значение поля «Спринт» YouTrack
        versionFieldVal:
          type: [string, "null"]
          maxLength: 500
        settings:
          type: [object, "null"]
          description: Настройки проекта на момент снимка (большой объект, вне этого контракта; проверяется как настройки проекта)
        items:
          type: [array, "null"]
          maxItems: 1000
          description: Состав задач роли
          items: { $ref: "#/components/schemas/Item" }
        personalPlanning:
          type: [object, "null"]
          description: |
            Персональное распределение роли — отсюда его читает интерфейс планера.
            `taskAssignments` — `{ "<issueId>": { assignee, assigneeName, dateStart, dateEnd } }`,
            `resourcesByAssignee` — ресурсы по людям. Сервер проверяет только, что это объект;
            внешним клиентам менять операцией `assignPerson`.
        hasWorkingCopy:
          type: [boolean, "null"]
          description: Служебное — у записи есть незавершённая рабочая копия
        revisions:
          type: [array, "null"]
          maxItems: 1000
          description: Журнал правок записи после согласования
          items:
            type: object
            required: [level]
            properties:
              at:
                type: [number, "null"]
                description: Момент правки, epoch ms
              by:
                type: [string, "null"]
                maxLength: 200
                description: Логин автора; у новых ревизий ставит сервер
              level:
                type: string
                enum: [META_ONLY, ALLOCATED_REVAL, CONFIRMED_REVAL, NONE]
                description: Уровень повторного согласования; NONE — только в записях прежних редакций
        migrationLog:
          type: [array, "null"]
          description: Служебный аудит схемных миграций — не отправлять
        pluginVersion:
          type: [string, "null"]
          maxLength: 32
          readOnly: true
          description: Маркер схемы данных; ставит сервер при каждой записи, клиентское значение игнорируется
        sprintGoal:
          type: [string, "null"]
          maxLength: 500
        goalOutcome:
          type: [string, "null"]
          enum: [achieved, partial, missed, null]
          description: Итог по цели спринта
        goalRetroNote:
          type: [string, "null"]
          maxLength: 1000
          description: Заметка ретроспективы по цели
        roles:
          type: [array, "null"]
          maxItems: 9
          uniqueItems: true
          description: Роли-участницы спринта (3.27.0)
          items: { $ref: "#/components/schemas/RoleKey" }
        agreed:
          type: [object, "null"]
          description: Слепок согласованного состава роли (3.39.0)
          required: [at, items]
          additionalProperties: false
          properties:
            at:
              type: number
              description: Момент согласования, epoch ms
            by:
              type: [string, "null"]
              maxLength: 200
            items:
              type: object
              maxProperties: 1000
              description: "`{ \"<issueId, до 64 символов>\": { e, x } }`: `e` — согласованная оценка в минутах, `x: 1` — задача была исключена"
              additionalProperties:
                type: object
                additionalProperties: false
                properties:
                  e: { type: [number, "null"] }
                  x: { const: 1 }
        phases:
          oneOf:
            - $ref: "#/components/schemas/SprintPhases"
            - type: "null"
          description: Фазы работ спринта. Берутся из хранимых записей — пишет их только `POST /sprint-data?action=phases`
        phasesUpdatedAt:
          type: [number, "null"]
          description: Момент последней правки фаз, epoch ms; ставит сервер
        phasesUpdatedBy:
          type: [string, "null"]
          maxLength: 200
          description: Отображаемое имя автора последней правки фаз; ставит сервер
      patternProperties:
        "^(resource|remain)[A-Za-z0-9_]*$":
          type: [number, "null"]
          minimum: -100000000
          maximum: 100000000
          description: Минуты; в отличие от рабочего слота, остаток может быть отрицательным
      additionalProperties: false

    HistoryOk:
      type: object
      description: "Ответ `GET /history`. Схема ответа: состав ключей может расширяться"
      required: [success, history, rev]
      properties:
        success:
          const: true
        history:
          type: array
          maxItems: 500
          description: Все записи истории проекта
          items: { $ref: "#/components/schemas/HistoryRecord" }
        orphanGanttBySprintId:
          type: object
          description: Служебная диагностика интерфейса планера — игнорировать
        rev:
          type: number
          description: Ревизия истории — `baseRev` для `POST /history` без `action` и `snapshot`; пока историю ни разу не записывали — 0

    HistoryReplaceRequest:
      type: object
      title: без action
      description: |
        Тело `POST /history` без `action` — полная замена истории. ⚠ Записи, которых нет
        в `history`, исчезают.
      required: [history, baseRev]
      additionalProperties: false
      properties:
        history:
          type: array
          maxItems: 500
          description: "Все записи истории проекта — хранимые заменяются этим массивом целиком. Не массив — `invalid_history_structure: not_array`"
          items: { $ref: "#/components/schemas/HistoryRecord" }
        baseRev:
          type: number
          description: "`rev` из `GET /history`; иначе `base_rev_required` (обязателен с 3.49.0), расхождение — `rev_conflict`"

    HistorySnapshotRequest:
      type: object
      title: snapshot
      description: |
        Тело `POST /history?action=snapshot` — запись ровно одной записи истории. ⚠ Запись
        с тем же `sprintId` заменяется целиком.
      required: [history, baseRev]
      additionalProperties: false
      properties:
        history:
          type: array
          minItems: 1
          maxItems: 1
          description: Ровно одна запись с непустым строковым `sprintId` — иначе `invalid_snapshot_body`
          items: { $ref: "#/components/schemas/HistoryRecord" }
        baseRev:
          type: number
          description: "`rev` из `GET /history`; иначе `base_rev_required` (обязателен с 3.49.0), расхождение — `rev_conflict`"

    HistoryImportReplaceRequest:
      type: object
      title: import-replace
      description: |
        Тело `POST /history?action=import-replace` — восстановление истории из резервной
        копии. ⚠ История заменяется целиком, ревизия не сверяется, атрибуция принимается
        от клиента как есть.
      required: [history]
      additionalProperties: false
      properties:
        history:
          type: array
          maxItems: 500
          description: Массив `history` из сохранённого ранее ответа `GET /history`. Не массив — `invalid_history_structure`
          items: { $ref: "#/components/schemas/HistoryRecord" }

    HistoryWriteOk:
      type: object
      description: "Успех `POST /history` — общий для всех вариантов. Схема ответа: состав ключей может расширяться"
      required: [success]
      properties:
        success:
          const: true
        action:
          type: string
          enum: [snapshot, import-replace]
          description: Присутствует у `snapshot` и `import-replace`
        rev:
          type: number
          description: Новая ревизия истории — есть у каждой успешной записи (до 3.49.1 отсутствовала у тела без `history`; теперь такой запрос отклоняется)
        cleared:
          const: true
          description: Только у `clear`
        count:
          type: number
          description: Только у `import-replace` — сколько записей записано

    CapacityPerson:
      type: object
      description: |
        Параметры участника в записи ёмкости спринта. Клиент задаёт четыре примитива: `grade`,
        `rate`, `participation`, `alloc`; `base` и `absencesApplied` считает сервер — в запросе они
        допускаются, но игнорируются. Ключи вне списка сервер не сохраняет и отказом на них не
        отвечает: опечатка в имени ключа молча даст значение по умолчанию. Нарушение типов и
        диапазонов — `invalid_capacity_structure`.
      properties:
        grade:
          type: [string, "null"]
          maxLength: 64
          description: |
            Грейд — ключ таблицы коэффициентов проекта (по умолчанию `Intern` 0, `Junior` 0.5,
            `Middle` 0.65, `Senior` 0.75; таблица меняется в настройках планера). Пусто — `Middle`.
            Грейд, которого в таблице нет, даёт коэффициент 0.
        rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Ставка, доля от полной (1 — полная ставка). Пусто — 1.
        participation:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Доля участия в этом спринте (1 — весь спринт на команду). Пусто — 1.
        alloc:
          type: [object, "null"]
          description: |
            Распределение базы участника по ролям — доли 0..1. Ключи — только роли планера: иной
            ключ отвергается (`invalid_capacity_structure`). Сумма долей больше 1 допустима при
            `save` (`allocOk: false` в ответе) и блокирует утверждение (`alloc_sum_exceeds_100`).
          properties:
            analysis:    { type: number, minimum: 0, maximum: 1 }
            testing:     { type: number, minimum: 0, maximum: 1 }
            devPlatform: { type: number, minimum: 0, maximum: 1 }
            devBack:     { type: number, minimum: 0, maximum: 1 }
            devFront:    { type: number, minimum: 0, maximum: 1 }
            devIos:      { type: number, minimum: 0, maximum: 1 }
            devAndroid:  { type: number, minimum: 0, maximum: 1 }
            devFs:       { type: number, minimum: 0, maximum: 1 }
            devDb:       { type: number, minimum: 0, maximum: 1 }
          additionalProperties: false
        base:
          type: [number, "null"]
          minimum: 0
          readOnly: true
          description: База участника в часах, полная точность — считает сервер; присланное игнорируется.
        absencesApplied:
          type: [array, "null"]
          readOnly: true
          description: |
            Отсутствия участника, пересекающие окно спринта, — копия на момент утверждения (у черновика —
            на момент сохранения). Ставит сервер; присланное игнорируется.
          items:
            $ref: "#/components/schemas/AbsenceEntry"
      additionalProperties: false

    CapacityRecord:
      type: object
      readOnly: true
      description: |
        Запись ёмкости одного спринта, как её хранит и пересчитывает сервер.
        Схема ответа: состав ключей может расширяться.
      properties:
        mode:
          type: string
          enum: [light, full]
          description: Режим расчёта; сервер пишет `full`.
        status:
          type: string
          enum: [draft, approved]
          description: "`draft` — сохранена, не утверждена; `approved` — утверждена."
        dirty:
          type: boolean
          description: "`true` — утверждённая запись изменена после утверждения (нужно переутверждение)."
        constants:
          type: object
          description: |
            Константы расчёта, взятые из настроек проекта; у утверждённой записи заморожены до
            переутверждения. `kpe` — карта «грейд → коэффициент», `hoursPerDay` — рабочих часов в дне,
            `usefulHoursPerDay` — полезных часов в дне.
          properties:
            kpe:
              type: object
              additionalProperties: { type: number }
            hoursPerDay: { type: number }
            usefulHoursPerDay: { type: number }
        calendarRef:
          type: object
          description: На какой календарь опирался расчёт — годы окна спринта и время загрузки календаря.
          properties:
            years:
              type: array
              items: { type: string }
            uploadedAt:
              type: [number, "null"]
              description: epoch ms; `null` — календарь не был загружен
        persons:
          type: object
          description: Участники — карта «логин → параметры».
          additionalProperties:
            $ref: "#/components/schemas/CapacityPerson"
        approvedBy:
          type: [string, "null"]
          description: Логин утвердившего — пользователь токена запроса `approve` либо `reapprove`; у черновика ключа нет.
        approvedAt:
          type: [number, "null"]
          description: Время первого утверждения, epoch ms; переутверждение его не меняет.
        reapprovals:
          type: array
          description: Журнал переутверждений.
          items:
            type: object
            properties:
              by: { type: string, description: Логин }
              at: { type: number, description: epoch ms }
        dateEnd:
          type: number
          description: Конец спринта, epoch ms — по нему упорядочен архив.
        pluginVersion:
          type: string
          description: Маркер схемы данных (внутреннее значение, не версия приложения).
        sprintId:
          type: string
          description: Идентификатор спринта — присутствует только у записей `GET /capacity-archive`.

    CapacityOk:
      type: object
      description: |
        Успех `GET /capacity` и `POST /capacity` (`save`, `approve`, `reapprove`).
        Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        sprintId:
          type: string
          description: Спринт из параметра запроса (у GET без параметра — пустая строка).
        capacity:
          oneOf:
            - $ref: "#/components/schemas/CapacityRecord"
            - type: "null"
          description: "Запись ёмкости; `null` — только у GET: записи у спринта нет либо `sprintId` не передан."
        archivedCount:
          type: number
          description: Только GET — число записей в архиве ёмкости.
        action:
          type: string
          enum: [save, approve, reapprove]
          description: Только POST — выполненное действие.
        allocOk:
          type: boolean
          description: "Только POST — `false`, если у кого-то из участников сумма долей по ролям больше 100 %."
        archived:
          type: number
          description: Только POST — сколько записей прошлых спринтов эта запись вытеснила в архив (обычно 0).
      required: [success, sprintId, capacity]

    CapacityArchiveOk:
      type: object
      description: |
        Успех `GET /capacity-archive`. Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        capacity:
          type: array
          description: Архивные записи ёмкости, свежие по `dateEnd` первыми; у каждой заполнен `sprintId`.
          items:
            $ref: "#/components/schemas/CapacityRecord"
      required: [success, capacity]

    CapacitySaveRequest:
      type: object
      title: "save · approve · reapprove"
      description: |
        Тело `POST /capacity` для `save`, `approve`, `reapprove` (и без `action`). Сервер использует
        только `persons`. Остальные ключи хранимой записи (`mode`, `status`, `dirty`, `constants`,
        `calendarRef`, `approvedBy`, `approvedAt`, `reapprovals`, `dateEnd`, `pluginVersion`) сервер
        принимает, проверяет по форме и игнорирует — не отправляйте их; ключи вне этого перечня
        отбрасываются.
      properties:
        persons:
          type: object
          description: |
            Состав участников записи целиком — карта «логин → параметры». ⚠ Участник, которого здесь
            нет, из записи исчезает; `{}` записывает пустой состав. Ключ обязателен
            (`capacity_persons_required`).
          additionalProperties:
            $ref: "#/components/schemas/CapacityPerson"
      required: [persons]
      additionalProperties: false

    UpsertPersonRequest:
      type: object
      title: upsertPerson
      description: |
        Тело мелкой операции `POST /capacity?action=upsertPerson` (3.49.0). `baseRev` не нужен — ревизии
        у ёмкости нет; ключи вне списка отбрасываются.
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 200
          description: Логин участника, 1..200 символов.
        person:
          $ref: "#/components/schemas/CapacityPerson"
          description: |
            Ключи, которые нужно задать либо изменить; у существующего участника остальные
            сохраняются, `alloc` заменяется целиком. `{}` у нового участника — значения по умолчанию.
      required: [login, person]
      additionalProperties: false

    CalendarDay:
      type: object
      description: |
        День-исключение производственного календаря. Дней, которых в календаре нет, правило по
        умолчанию: суббота и воскресенье — выходные, остальные — рабочие. Ключи вне списка не
        сохраняются.
      properties:
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Существующая календарная дата `YYYY-MM-DD`; год обязан совпадать с ключом года, в пределах года дата не повторяется.
        type:
          type: string
          enum: [holiday, short, workday]
          description: "`holiday` — нерабочий день (0 часов); `short` — сокращённый рабочий день; `workday` — полный рабочий день (перенос на выходной)."
        hoursDelta:
          type: [number, "null"]
          minimum: -8
          maximum: 0
          description: |
            На сколько часов день короче обычного. У `short` обязателен, от −8 до −0.5
            (`invalid_delta`); у `holiday` и `workday` — 0 либо ключ опущен (`delta_must_be_zero`).
            В ответах присутствует всегда.
      required: [date, type]
      additionalProperties: false

    Calendar:
      type: object
      description: |
        Производственный календарь проекта. В запросе значим только `years`; остальные ключи
        проставляет сервер, прочие отбрасываются. Не больше 300 КБ после сериализации.
      properties:
        years:
          type: object
          description: |
            Карта «год → дни-исключения». Ключ — четыре цифры (`invalid_year`). ⚠ Запись заменяет
            календарь целиком: год, которого здесь нет, стирается; отсутствие ключа `years` равно
            пустому календарю.
          patternProperties:
            "^\\d{4}$":
              type: array
              items:
                $ref: "#/components/schemas/CalendarDay"
          additionalProperties: false
        uploadedBy:
          type: string
          readOnly: true
          description: Логин загрузившего — пользователь токена; присланное перезаписывается.
        uploadedAt:
          type: number
          readOnly: true
          description: Время загрузки, epoch ms — ставит сервер.
        pluginVersion:
          type: string
          readOnly: true
          description: Маркер схемы данных — ставит сервер.
      required: [years]
      additionalProperties: false

    CalendarOk:
      type: object
      description: |
        Успех `GET /calendar` и `POST /calendar`. Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        calendar:
          oneOf:
            - $ref: "#/components/schemas/Calendar"
            - type: "null"
          description: "Календарь проекта; `null` — только у GET: календарь ещё не загружали."
      required: [success, calendar]

    AbsenceEntry:
      type: object
      description: |
        Одно отсутствие сотрудника — диапазон календарных дат включительно. Внутри списка сотрудника
        запись опознаётся парой `from` + `to`. Ключи вне списка не сохраняются.
      properties:
        from:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Первый день отсутствия, существующая дата `YYYY-MM-DD`; не позже `to` (`from_after_to`).
        to:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Последний день отсутствия, `YYYY-MM-DD`; один день — `to` равен `from`.
        type:
          type: string
          enum: [vacation, sick, out_of_membership, regional_holiday, training, teamleading, other]
          description: |
            Тип: `vacation` — отпуск, `sick` — больничный, `out_of_membership` — вне команды (ещё не
            пришёл либо уже ушёл), `regional_holiday` — региональный праздник, `training` — обучение,
            `teamleading` — тимлидинг, `other` — прочее. На расчёт тип не влияет.
        hoursDelta:
          type: [number, "null"]
          minimum: 0.5
          maximum: 24
          description: |
            Частичное отсутствие — часов в каждом дне диапазона (не больше рабочих часов дня).
            Ключа нет либо `null` — отсутствие на полный день.
      required: [from, to, type]
      additionalProperties: false

    AbsencesOk:
      type: object
      description: |
        Успех `GET /absences` и полной замены `POST /absences`. Схема ответа: состав ключей может
        расширяться.
      properties:
        success:
          const: true
        absences:
          type: object
          description: Только GET — реестр целиком, карта «логин → записи».
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AbsenceEntry"
        rev:
          type: number
          description: Ревизия реестра — у GET текущая (0, если реестр не записывали), у POST новая. Передаётся как `baseRev` следующей записи.
      required: [success, rev]

    AbsencesRequest:
      type: object
      title: "⚠ без action — полная замена"
      x-restricted: true
      description: |
        ⚠ Ограниченная часть `POST /absences`: реестр отсутствий всех сотрудников заменяется
        присланным целиком. Принимается только эта обёртка. Для правки одного отсутствия —
        `upsertAbsence` и `removeAbsence`.
      properties:
        absences:
          type: object
          description: |
            Карта «логин → записи» по всем сотрудникам. Логин — строка 1..200 символов
            (`invalid_login`). ⚠ Сотрудник, которого здесь нет, теряет все отсутствия; `{}` очищает
            реестр.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AbsenceEntry"
        baseRev:
          type: number
          description: "`rev` из `GET /absences` (реестр не записывали — 0). Расхождение — `rev_conflict`, ничего не записано."
      required: [absences, baseRev]
      additionalProperties: false

    UpsertAbsenceRequest:
      type: object
      title: upsertAbsence
      description: |
        Тело мелкой операции `POST /absences?action=upsertAbsence` (3.49.0). Ключи вне списка
        отбрасываются.
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 200
          description: Логин сотрудника, 1..200 символов.
        entry:
          $ref: "#/components/schemas/AbsenceEntry"
          description: |
            Запись сотрудника с той же парой `from` + `to` заменяется этой целиком, иначе добавляется.
        baseRev:
          type: number
          description: "`rev` из `GET /absences` либо из ответа предыдущей записи."
      required: [login, entry, baseRev]
      additionalProperties: false

    RemoveAbsenceRequest:
      type: object
      title: removeAbsence
      description: |
        Тело мелкой операции `POST /absences?action=removeAbsence` (3.49.0). Ключи вне списка
        отбрасываются.
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 200
          description: Логин сотрудника, 1..200 символов.
        from:
          type: string
          description: "`from` удаляемой записи — точное совпадение со значением из `GET /absences`."
        to:
          type: string
          description: "`to` удаляемой записи — точное совпадение; пары `from` + `to` у сотрудника нет — `absence_not_found`."
        baseRev:
          type: number
          description: "`rev` из `GET /absences` либо из ответа предыдущей записи."
      required: [login, from, to, baseRev]
      additionalProperties: false

    Release:
      type: object
      description: |
        Запись релиза — в том виде, в каком её присылает клиент и хранит сервер. Ключи строго
        из этого списка: запись с посторонним ключом, с неверным типом либо длиной значения
        отвергается вместе со всей записью реестра (`invalid_releases_structure`).
        Обязателен только `id`; у остальных ключей допустим `null`.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Идентификатор релиза, уникален в реестре проекта; задаёт клиент при создании
            (интерфейс планера генерирует вид `rel-…`), после создания не меняется.
        name:
          type: [string, "null"]
          maxLength: 200
          description: Название релиза
        kind:
          type: [string, "null"]
          enum: [release, hotfix, null]
          description: "Вид: release — плановый релиз, hotfix — хотфикс"
        source:
          type: [string, "null"]
          enum: [internal, vendor, null]
          description: "Источник поставки: internal — собственная разработка, vendor — поставка вендора"
        status:
          type: [string, "null"]
          enum: [planned, prep, work, released, cancelled, null]
          description: |
            Хранимый статус. Рабочая цепочка: planned (запланирован) → prep (подготовка) →
            work (в работе) → released (выпущен); cancelled (отменён) — вне цепочки.
            released и cancelled — закрытые: такие релизы со временем уходят в архив.
            «Просрочен» в интерфейсе планера — вычисляемый признак (плановая дата прошла,
            релиз не закрыт), в записи не хранится.
        plannedDate:
          type: [number, string, "null"]
          description: |
            Плановая дата выпуска. Присылать число — epoch-ms UTC-полночи даты: так дату
            пишет и читает интерфейс планера. Строку сервер тоже примет, но интерфейс
            планера строковую дату не покажет.
        freezeDate:
          type: [number, string, "null"]
          description: Дата заморозки состава — те же правила, что у plannedDate
        freezeLocked:
          type: [boolean, "null"]
          description: |
            Состав заморожен. Хранимый признак: добавление и удаление задач у замороженного
            релиза блокирует интерфейс планера, сервер по нему запись не ограничивает.
        patchNote:
          type: [string, "null"]
          maxLength: 20000
          description: Описание изменений релиза (патчноут)
        notes:
          type: [string, "null"]
          maxLength: 20000
          description: Заметки
        taskUrl:
          type: [string, "null"]
          maxLength: 2000
          description: Ссылка на задачу релиза во внешней системе; интерфейс планера открывает только http/https
        roleReps:
          type: [object, "null"]
          description: Представители релиза — логины YouTrack; иные ключи отвергаются
          properties:
            manager:
              type: [string, "null"]
              maxLength: 128
              description: Логин релиз-менеджера этого релиза
            engineer:
              type: [string, "null"]
              maxLength: 128
              description: Логин релиз-инженера этого релиза
          additionalProperties: false
        issues:
          type: [array, "null"]
          maxItems: 2000
          items:
            type: string
            maxLength: 64
          description: |
            Состав релиза — идентификаторы задач вида `DEMO-101`, порядок сохраняется.
            Формат и существование задач сервер не проверяет.
        snapshot:
          type: [object, "null"]
          description: |
            Слепок закрытия: состояние состава на момент перевода в released либо cancelled;
            собирает интерфейс планера. Сервер проверяет только, что это объект, внутренняя
            структура контрактом не обещана. Авто-архив берёт из слепка числовой `closedAt`
            (epoch-ms) как момент закрытия, при его отсутствии — `updatedAt` записи.
        readiness:
          type: [object, "null"]
          description: |
            Контейнер сводки готовности. Сервер проверяет только, что это объект; интерфейс
            планера ключ не заполняет — сводка готовности закрытого релиза лежит в snapshot.
        createdBy:
          type: [string, "null"]
          maxLength: 200
          description: Логин создателя. Ставит сервер, присланное значение не учитывается
        createdAt:
          type: [number, "null"]
          description: Момент создания, epoch-ms. Ставит сервер, присланное значение не учитывается
        updatedBy:
          type: [string, "null"]
          maxLength: 200
          description: |
            Логин автора последней правки. Ставит сервер: меняется, только если в записи
            изменилось что-либо, кроме аудит-полей; присланное значение не учитывается.
        updatedAt:
          type: [number, "null"]
          description: Момент последней правки, epoch-ms. Ставит сервер — по тому же правилу, что updatedBy
        pluginVersion:
          type: [string, "null"]
          maxLength: 40
          description: |
            Версия планера, записавшая релиз. Сервер этот ключ не ставит и не сверяет —
            значение клиентское; внешнему клиенту можно не присылать.
      required: [id]
      additionalProperties: false

    ReleasesOk:
      type: object
      description: |
        Ответ `GET /releases` — активный реестр релизов проекта.
        Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
          description: Активные релизы в порядке хранения; реестр пуст — пустой массив
        perms:
          type: object
          description: Права вызывающего на запись релизов — то же, что проверит `POST /releases`
          properties:
            canManage:
              type: boolean
              description: Релиз-менеджер либо управление настройками — доступны все варианты записи
            canAdvance:
              type: boolean
              description: |
                Доступно продвижение статуса: true у релиз-менеджера и у релиз-инженера.
                true при canManage:false — вызывающий релиз-инженер.
          required: [canManage, canAdvance]
        archivedCount:
          type: number
          description: Число записей в архиве (`GET /releases-archive`)
        rev:
          type: number
          description: Ревизия реестра — значение `baseRev` следующей записи; реестр ещё не записывался — 0
      required: [success, releases, perms, archivedCount, rev]

    PostReleasesOk:
      type: object
      description: |
        Успех записи реестра релизов. У мелкой операции ответ несёт те же ключи плюс
        `action` и `applied` (схема `OpsOk`).
        Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
          description: |
            Активный реестр после записи — с серверными аудит-полями и уже без записей,
            переехавших в архив этой записью.
        archived:
          type: number
          description: Сколько закрытых релизов эта запись перенесла в архив; обычно 0
        rev:
          type: number
          description: Новая ревизия реестра — значение `baseRev` следующей записи
      required: [success, releases, archived, rev]

    ReleasesArchiveOk:
      type: object
      description: |
        Ответ `GET /releases-archive` — закрытые релизы, вынесенные из активного реестра.
        Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        releases:
          type: array
          items:
            $ref: "#/components/schemas/Release"
          description: Записи архива в порядке переноса; архив пуст — пустой массив
      required: [success, releases]

    ReleasesRequest:
      type: object
      title: "⚠ без action — полная замена"
      x-restricted: true
      description: |
        Полная замена активного реестра релизов: записи, которых нет в `releases`, удаляются;
        пустой массив стирает все активные релизы. Посторонние ключи верхнего уровня сервер
        не читает.
      properties:
        releases:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Release"
          description: |
            Реестр целиком; `id` записей уникальны. Ключ обязателен и должен быть массивом —
            иначе `invalid_releases_structure`, ничего не записано.
        baseRev:
          type: number
          description: |
            `rev` из `GET /releases` либо из ответа предыдущей записи. Обязателен числом
            (3.49.0) — иначе `base_rev_required`; расхождение с ревизией реестра —
            `rev_conflict`, ничего не записано.
      required: [releases, baseRev]

    UpsertReleaseRequest:
      type: object
      title: upsertRelease
      description: |
        Тело `?action=upsertRelease` (3.49.0). Посторонние ключи верхнего уровня сервер
        отбрасывает молча; ключи внутри `release` — строго по схеме `Release`.
      properties:
        release:
          $ref: "#/components/schemas/Release"
          description: |
            Запись либо её часть: `id` обязателен, остальные ключи — только изменяемые.
            У существующего релиза ключи из тела заменяют хранимые, прочие сохраняются;
            убрать значение — прислать `null`.
        baseRev:
          type: number
          description: "`rev` из `GET /releases` либо из ответа предыдущей записи; обязателен числом"
      required: [release, baseRev]

    SetReleaseStatusRequest:
      type: object
      title: setReleaseStatus
      description: |
        Тело `?action=setReleaseStatus` (3.49.0). Посторонние ключи верхнего уровня сервер
        отбрасывает молча.
      properties:
        id:
          type: string
          minLength: 1
          description: Идентификатор релиза; релиза нет в активном реестре — `release_not_found`
        status:
          type: string
          enum: [planned, prep, work, released, cancelled]
          description: |
            Новый статус. Релиз-менеджеру — любой; релиз-инженеру — только следующий шаг
            цепочки planned → prep → work → released.
        snapshot:
          type: [object, "null"]
          description: |
            Слепок закрытия (см. `Release.snapshot`); необязателен. Если ключ передан —
            значение заменяет хранимый слепок (`null` — убирает). Релиз-инженеру — только
            вместе с переводом в released.
        baseRev:
          type: number
          description: "`rev` из `GET /releases` либо из ответа предыдущей записи; обязателен числом"
      required: [id, status, baseRev]

    ReleaseIssuesRequest:
      type: object
      title: "addReleaseIssues | removeReleaseIssues"
      description: |
        Общее тело `?action=addReleaseIssues` и `?action=removeReleaseIssues` (3.49.0).
        Посторонние ключи верхнего уровня сервер отбрасывает молча.
      properties:
        id:
          type: string
          minLength: 1
          description: Идентификатор релиза; релиза нет в активном реестре — `release_not_found`
        issues:
          type: array
          maxItems: 2000
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: |
            Идентификаторы задач вида `DEMO-101`: добавляемые в состав либо убираемые из него.
            Нарушение формы — `ops_field_invalid:issues`.
        baseRev:
          type: number
          description: "`rev` из `GET /releases` либо из ответа предыдущей записи; обязателен числом"
      required: [id, issues, baseRev]

    RemoveReleaseRequest:
      type: object
      title: removeRelease
      description: |
        Тело `?action=removeRelease` (3.51.0). Посторонние ключи верхнего уровня сервер
        отбрасывает молча.
      properties:
        id:
          type: string
          minLength: 1
          description: Идентификатор релиза; релиза нет в активном реестре — `release_not_found`
        baseRev:
          type: number
          description: "`rev` из `GET /releases` либо из ответа предыдущей записи; обязателен числом"
      required: [id, baseRev]

    SprintLockOk:
      type: object
      description: |
        Состояние блокировки создания спринтов — ответ `GET /sprint-lock` и `POST /sprint-lock`.
        Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        locked:
          type: boolean
          description: true — создание новых спринтов в проекте заблокировано; у POST — записанное значение
        canToggle:
          type: boolean
          description: Вызывающий вправе переключать блокировку. Только в ответе GET
      required: [success, locked]

    SprintLockRequest:
      type: object
      description: |
        Тело `POST /sprint-lock`. Посторонние ключи верхнего уровня сервер отбрасывает молча.
      properties:
        locked:
          type: boolean
          description: "true — заблокировать создание новых спринтов, false — снять блокировку; строго логическое значение"
      required: [locked]

    PlannerDisabledRequest:
      type: object
      description: |
        Тело `POST /planner-disabled`. Посторонние ключи верхнего уровня сервер отбрасывает
        молча.
      properties:
        disabled:
          type: boolean
          description: "true — отключить планер в проекте, false — включить обратно; строго логическое значение"
      required: [disabled]

    PlannerDisabledOk:
      type: object
      description: |
        Ответ `POST /planner-disabled`.
        Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        disabled:
          type: boolean
          description: Записанное состояние — true, планер в проекте отключён
      required: [success, disabled]

    UpdateIssueFieldRequest:
      type: object
      description: |
        Тело `POST /update-issue-field` — одно поле одной задачи за запрос. Посторонние ключи
        верхнего уровня сервер отбрасывает молча.
      properties:
        issueId:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z][A-Za-z0-9_]*-\\d+$"
          description: Идентификатор задачи вида `DEMO-101`; задача должна принадлежать проекту запроса
        fieldName:
          type: string
          maxLength: 200
          description: |
            Имя поля задачи в YouTrack — одно из полей, назначенных планеру в настройках
            проекта. Без управляющих символов и знаков `<`, `>`, `"`.
        type:
          type: string
          enum: [period, enum, state, version, owned, build, user]
          default: enum
          description: |
            Тип поля — определяет, как читается `value`: period — минуты; user — логин;
            остальные — имя значения из набора поля.
        value:
          type: [string, number, "null"]
          description: |
            Новое значение. Для user — логин (до 200 символов), для period — целое число
            минут от 0 до 100000, для остальных типов — имя значения (до 500 символов).
            `null` очищает поле (у period записывает 0). Для типов, кроме period, ключ
            нужно передавать всегда: отсутствие ключа — отказ `value_not_found` либо
            `user_not_found`, а не очистка.
      required: [issueId, fieldName]

    UpdateIssueFieldOk:
      type: object
      description: |
        Подтверждение записи поля задачи.
        Схема ответа: состав ключей может расширяться.
      properties:
        success:
          const: true
        issueId:
          type: string
          description: Идентификатор задачи из запроса
        fieldName:
          type: string
          description: Имя поля из запроса
      required: [success, issueId, fieldName]
