name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build bundle
        run: npm run build

      - name: Verify whitelist sync idempotent (D125 — AUTOGEN guard)
        run: |
          npm run build:whitelists
          git diff --exit-code backend-project.js || { echo "ERROR: backend-project.js differs after sync. Edit schema/whitelists.json, not the AUTOGEN block."; exit 1; }

      - name: Syntax check (build:check)
        run: npm run build:check

      - name: Validate manifest.json
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json valid');"

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
