name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(node -e "console.log(require('./manifest.json').version)")
          if [ "$MANIFEST_VERSION" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match tag (${{ steps.version.outputs.number }})"
            exit 1
          fi

      - name: Build bundle
        run: npm run build

      - name: Syntax check
        run: npm run build:check

      - name: Run tests (unit + golden)
        run: npm test

      - name: Create release zip
        id: zip
        run: |
          ZIP_NAME="Smart-Sprint-Planner-${{ steps.version.outputs.tag }}.zip"
          zip -r "$ZIP_NAME" . \
            -x '*.DS_Store' '*/.DS_Store' \
               '.claude/*' '.roadmap-source/*' \
               'CLAUDE.md' 'Spec/*' 'Spec' 'RoadMap/*' 'RoadMap' 'NEXT_SESSION_PROMPT.md' 'PROJECT_ROADMAP.md' 'PROJECT_ROADMAP.ru.md' \
               'Documentation/*' 'Documentation' \
               'published/*' 'published' \
               'MP publication/*' 'MP publication' \
               'node_modules/*' 'package*.json' 'playwright.config.js' \
               'tests/*' 'widgets/main/src/*' \
               'schema/*' 'schema' 'scripts/*' 'scripts' \
               'playwright-report/*' 'test-results/*' \
               '.git/*' '.github/*' \
               'USER-GUIDE.pdf' '*.pdf'
          ls -la "$ZIP_NAME"
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          NOTES_FILE="RELEASE_NOTES_${{ steps.version.outputs.tag }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP="${{ steps.zip.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already published (e.g. manual showcase) — attach/refresh the CI zip
            gh release upload "$TAG" "$ZIP" --clobber
          elif [ -n "${{ steps.notes.outputs.file }}" ]; then
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file "${{ steps.notes.outputs.file }}"
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
          fi
